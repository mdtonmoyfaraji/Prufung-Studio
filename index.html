  }
  const umls = el("div", { class: "umlauts" }, ["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü", "„", "“", "–"].map(ch =>
    el("button", { type: "button", onclick: () => {
      const s = ta.selectionStart, e2 = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + ch + ta.value.slice(e2);
      ta.selectionStart = ta.selectionEnd = s + ch.length;
      ta.focus(); R.answers[key] = ta.value; saveRunAnswers(); upd();
    } }, ch)));

  right.append(el("div", { class: "card" },
    el("div", { class: "row", style: "justify-content:space-between" },
      el("h4", { text: "Ihre Antwort" }), counter),
    el("div", { style: "margin:8px 0" }, umls),
    ta,
    el("div", { class: "row", style: "margin-top:10px" },
      el("button", { class: "btn sm accent", onclick: () => aiGradeWriting(part, c, ta.value, key) }, "✦ Von der KI bewerten lassen"),
      el("button", { class: "btn sm ghost", onclick: () => { navigator.clipboard?.writeText(ta.value); toast("Text kopiert."); } }, "Kopieren"),
      el("span", { class: "xsmall muted", id: "gradeNote_" + part.id,
        text: R.answers[part.id + ":grade"] != null ? "KI-Bewertung gespeichert: " + Math.round(R.answers[part.id + ":grade"] * 100) + " %" : "" })
    )));
  upd();
}

/* ---- speaking ---- */
/* Languages offered for live speech-to-text. Keyed to BCP-47 tags the
   browser's SpeechRecognition understands. */
const SPEECH_RECOG_LANGS = [
  ["de-DE", "Deutsch (Deutschland)"], ["de-AT", "Deutsch (Österreich)"], ["de-CH", "Deutsch (Schweiz)"],
  ["en-US", "Englisch (USA)"], ["en-GB", "Englisch (UK)"],
  ["tr-TR", "Türkisch"], ["ru-RU", "Russisch"], ["uk-UA", "Ukrainisch"], ["pl-PL", "Polnisch"],
  ["ar-SA", "Arabisch"], ["fr-FR", "Französisch"], ["es-ES", "Spanisch"], ["it-IT", "Italienisch"],
  ["pt-PT", "Portugiesisch"], ["ro-RO", "Rumänisch"], ["nl-NL", "Niederländisch"],
  ["zh-CN", "Chinesisch"], ["hi-IN", "Hindi"], ["fa-IR", "Persisch"], ["ur-PK", "Urdu"]
];

/* On Android, MediaRecorder (used to save a playable recording) and the
   native SpeechRecognition engine (used for the live transcript) fight over
   exclusive access to the microphone when started at the same time. Desktop
   OSes happily share the mic between two consumers; Android generally does
   not, and the failure often surfaces — misleadingly — as a "network" error
   from SpeechRecognition, even with a perfectly fine internet connection.
   So on Android we let the person choose which one gets the mic instead of
   silently racing both for it. */
const isAndroid = /Android/i.test(navigator.userAgent || "");

/* Phones (Android Chrome above all) deliver cumulative speech results:
   "während" → "während der" → "während der Aufnahme", every one of them as its
   own result. Appending them piece by piece gives the endless repetition.
   This folds a list of result texts into one clean sentence: a result that
   merely extends what is already there replaces it, one already contained is
   skipped, and a partial overlap is joined once. */
function mergeTranscript(segments) {
  const W = s => String(s || "").trim().split(/\s+/).filter(Boolean);
  const N = w => String(w).toLowerCase().replace(/[.,;:!?„“"'()\-–]/g, "");
  const eq = (a, b) => N(a) === N(b);
  const startsWith = (big, small) => small.length > 0 && big.length >= small.length && small.every((w, i) => eq(big[i], w));
  const endsWith = (big, small) => small.length > 0 && big.length >= small.length && small.every((w, i) => eq(big[big.length - small.length + i], w));
  let acc = [], last = [];
  for (const seg of segments) {
    const w = W(seg);
    if (!w.length) continue;
    if (!acc.length) { acc = w.slice(); last = w; continue; }
    if (startsWith(w, acc)) { acc = w.slice(); last = w; continue; }
    if (last.length && startsWith(w, last)) { acc = acc.slice(0, acc.length - last.length).concat(w); last = w; continue; }
    if (endsWith(acc, w)) continue;
    let found = 0;
    for (let k = Math.min(acc.length, w.length - 1, 12); k >= 2; k--) {
      if (endsWith(acc, w.slice(0, k))) { found = k; break; }
    }
    if (found) { acc = acc.concat(w.slice(found)); last = w; continue; }
    acc = acc.concat(w); last = w;
  }
  return acc.join(" ");
}


function renderSpeaking(col, right, part, c) {
  const R = S.run, key = part.id + ":0";
  const audioDbKey = "audio:" + R.testId + ":" + R.moduleKey + ":" + key;
  const secs = c.seconds || part.seconds || 120;
  const prep = c.prepSec != null ? c.prepSec : part.prepSec;

  col.append(el("div", { class: "card tight" },
    el("h4", { text: c.title || part.task }),
    el("p", { style: "margin-top:8px", text: c.prompt || "" }),
    c.topics ? el("div", { class: "col", style: "gap:8px;margin-top:10px" }, c.topics.map((tp, i) =>
      el("div", { class: "card tight", style: "background:var(--color-bg-2)" },
        el("b", { text: "Thema " + (i + 1) }), el("p", { class: "small", style: "margin:4px 0 0", text: tp })))) : null,
    c.bullets ? el("ul", { style: "margin:10px 0 0 18px;padding:0" }, c.bullets.map(b => el("li", { class: "small", text: b }))) : null,
    c.chart ? el("div", { class: "stimulus", style: "margin-top:10px;font-family:var(--font-mono);font-size:13px", text: c.chart }) : null,
    c.tips ? el("div", { class: "xsmall muted", style: "margin-top:10px", text: c.tips }) : null));

  /* timer + recorder (with Pause / Weiter) */
  const disp = el("div", { class: "clock", text: fmtClock(secs) });
  let tm = null, remaining = secs, rec = null, recStream = null, chunks = [];
  let recognition = null, recognizing = false;
  let state = "idle";                       // idle | recording | paused
  const audioBox = el("div", { style: "margin-top:10px" });
  const startBtn = el("button", { class: "btn accent" }, "● Aufnahme starten");
  const pauseBtn = el("button", { class: "btn", disabled: true }, "⏸ Pause");
  const finishBtn = el("button", { class: "btn sm ghost", disabled: true, title: "Aufnahme abschließen und Audio speichern" }, "✓ Beenden");
  const delBtn = el("button", { class: "btn sm ghost", style: "display:none" }, "🗑 Aufnahme löschen");

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const langSel = SR
    ? el("select", { title: "Sprache der Live-Spracherkennung" },
        SPEECH_RECOG_LANGS.map(([code, label]) =>
          el("option", { value: code, selected: code === (S.settings.speechRecogLang || "de-DE"), text: label })))
    : null;
  if (langSel) langSel.onchange = () => { S.settings.speechRecogLang = langSel.value; saveSettings(); };
  const liveBox = el("div", { class: "xsmall muted", style: "margin-top:6px;min-height:18px;font-style:italic" });

  /* Android-only: let the person pick live transcript OR a recorded audio
     file, since the device's microphone can't reliably feed both at once. */
  const androidPreferLive = SR && isAndroid;
  const liveToggle = androidPreferLive
    ? el("label", { class: "row xsmall muted", style: "align-items:center;gap:6px;margin-top:6px" },
        el("input", {
          type: "checkbox",
          checked: S.settings.androidPreferLiveTranscript !== false,
          onchange: e => { S.settings.androidPreferLiveTranscript = e.target.checked; saveSettings(); }
        }),
        el("span", { text: "Live-Transkription statt Audioaufnahme (auf Android kann das Mikrofon nicht beides gleichzeitig)" }))
    : null;

  function showAudio(blob) {
    audioBox.innerHTML = "";
    audioBox.append(el("audio", { controls: true, src: URL.createObjectURL(blob), style: "width:100%" }));
    delBtn.style.display = "";
  }
  idbGet(audioDbKey).then(blob => { if (blob) showAudio(blob); }).catch(() => {});
  delBtn.onclick = () => {
    audioBox.innerHTML = ""; delBtn.style.display = "none";
    idbDel(audioDbKey).catch(() => {});
  };

  function syncBtns() {
    startBtn.disabled = state !== "idle";
    pauseBtn.disabled = state === "idle";
    pauseBtn.textContent = state === "paused" ? "▶ Weiter" : "⏸ Pause";
    pauseBtn.className = "btn" + (state === "paused" ? " accent" : "");
    finishBtn.disabled = state === "idle";
    ta.readOnly = state === "recording";      // the live text is written by the recognizer while recording
  }

  function tick() {
    remaining--; disp.textContent = fmtClock(remaining);
    disp.className = "clock" + (remaining < 15 ? " crit" : remaining < 45 ? " warn" : "");
    if (remaining <= 0) finishRec();
  }

  function speechErrMsg(code) {
    return ({
      "not-allowed": "Mikrofonzugriff für Live-Transkription verweigert.",
      "service-not-allowed": "Mikrofonzugriff für Live-Transkription verweigert.",
      "audio-capture": "Kein Mikrofon gefunden.",
      "network": isAndroid
        ? "Spracherkennung nicht erreichbar — auf Android meist ein Mikrofon-Konflikt (z. B. gleichzeitige Aufnahme einer anderen App), seltener fehlendes Internet."
        : "Keine Verbindung für die Spracherkennung (Internet nötig).",
      "language-not-supported": "Sprache wird nicht unterstützt.",
      "no-speech": null, "aborted": null
    })[code] ?? "Live-Transkription nicht verfügbar.";
  }

  /* ---- live transcript ----
     Text = `base` (what was already in the box when this take began) + one
     entry per recognition session. Every session REBUILDS its text from the
     complete result list (mergeTranscript) instead of appending pieces —
     that is what stops the stuttering "während während der während der …"
     on phones, where the engine hands out cumulative results. */
  let base = "", sessTexts = [], epoch = 0;
  function paintTranscript() {
    ta.value = [base.trim(), ...sessTexts.filter(Boolean)].filter(Boolean).join(" ");
    R.answers[key] = ta.value; saveRunAnswers();
  }
  function newBase() { base = ta.value; sessTexts = []; epoch++; }

  function startRecognition() {
    if (!SR) { liveBox.textContent = "⚠ Dieser Browser unterstützt keine Live-Transkription — Text bitte manuell eingeben."; return; }
    try {
      const myEpoch = epoch, idx = sessTexts.push("") - 1;
      const r = new SR();
      r.lang = (langSel && langSel.value) || S.settings.speechRecogLang || "de-DE";
      r.continuous = true;
      r.interimResults = true;
      r.onresult = ev => {
        if (myEpoch !== epoch) return;
        const segs = [];
        for (let i = 0; i < ev.results.length; i++) segs.push(ev.results[i][0].transcript);
        sessTexts[idx] = mergeTranscript(segs);
        paintTranscript();
      };
      r.onerror = ev => {
        const msg = speechErrMsg(ev.error);
        if (msg) { liveBox.textContent = "⚠ " + msg; toast(msg, "err"); }
        if (ev.error === "not-allowed" || ev.error === "service-not-allowed") recognizing = false;
      };
      /* browsers end recognition on their own now and then — start a fresh
         session (its own text slot) as long as we are still recording */
      r.onend = () => {
        if (recognizing && recognition === r && myEpoch === epoch) { try { startRecognition(); } catch (e2) {} }
      };
      recognition = r; recognizing = true;
      r.start();
      liveBox.textContent = "";
    } catch (e) {
      recognition = null; recognizing = false;
      liveBox.textContent = "⚠ Live-Transkription konnte nicht gestartet werden.";
    }
  }
  function stopRecognition() {
    recognizing = false;
    const r = recognition; recognition = null;
    if (r) { try { r.stop(); } catch (e) {} }
  }

  function savePartialAudio() {
    if (!chunks.length) return;
    const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
    showAudio(blob);
    idbSet(audioDbKey, blob).catch(() => {});
  }

  function startRec() {
    remaining = secs; disp.textContent = fmtClock(remaining); disp.className = "clock";
    state = "recording"; delBtn.style.display = "none"; syncBtns();
    newBase();
    tm = setInterval(tick, 1000);

    /* Recognition FIRST and synchronously inside the click handler — mobile
       browsers drop the "user activation" flag very quickly. */
    startRecognition();

    if (androidPreferLive && S.settings.androidPreferLiveTranscript !== false) {
      audioBox.innerHTML = "";
      audioBox.append(el("div", { class: "xsmall muted", style: "font-style:italic" },
        "Auf Android läuft während der Live-Transkription keine separate Audioaufnahme (Mikrofon-Konflikt) — der Text oben wird trotzdem live mitgeschrieben."));
    } else {
      (async () => {
        try {
          recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chunks = []; rec = new MediaRecorder(recStream);
          rec.ondataavailable = e => {
            if (e.data && e.data.size) chunks.push(e.data);
            if (state === "paused") savePartialAudio();    // safe copy in case the person leaves now
          };
          rec.onstop = () => {
            if (recStream) recStream.getTracks().forEach(t2 => t2.stop());
            recStream = null;
            if (chunks.length) {
              const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
              showAudio(blob);
              idbSet(audioDbKey, blob).catch(() => toast("Aufnahme konnte nicht gespeichert werden (Speicherplatz?).", "err"));
            }
          };
          rec.start();
          if (state === "paused") { try { rec.pause(); rec.requestData(); } catch (e3) {} }
        } catch (e) {
          toast("Kein Mikrofonzugriff — der Zeitgeber läuft trotzdem.", "");
        }
      })();
    }
  }

  function pauseRec(auto) {
    if (state !== "recording") return;
    state = "paused";
    clearInterval(tm); tm = null;
    stopRecognition();
    if (rec && rec.state === "recording") { try { rec.pause(); rec.requestData(); } catch (e) {} }
    liveBox.textContent = "⏸ Pausiert — mit „Weiter“ geht es genau hier weiter.";
    syncBtns();
    if (auto) toast("Aufnahme pausiert.", "");
  }
  function resumeRec() {
    if (state !== "paused") return;
    state = "recording";
    newBase();                                  // continue after whatever the text says now (it may have been corrected)
    tm = setInterval(tick, 1000);
    startRecognition();                          // inside the tap → allowed on phones
    if (rec && rec.state === "paused") { try { rec.resume(); } catch (e) {} }
    syncBtns();
  }
  function finishRec() {
    if (state === "idle") return;
    state = "idle";
    clearInterval(tm); tm = null;
    stopRecognition();
    if (rec && rec.state !== "inactive") { try { rec.stop(); } catch (e) {} }
    else if (recStream) { recStream.getTracks().forEach(t2 => t2.stop()); recStream = null; }
    liveBox.textContent = "";
    syncBtns();
  }

  startBtn.onclick = startRec;
  pauseBtn.onclick = () => (state === "paused" ? resumeRec() : pauseRec(false));
  finishBtn.onclick = finishRec;

  /* leaving the tab / locking the phone silences the microphone anyway —
     pause cleanly so nothing is lost and the timer stops */
  const onHidden = () => {
    if (!disp.isConnected) { document.removeEventListener("visibilitychange", onHidden); if (state !== "idle") finishRec(); return; }
    if (document.hidden && state === "recording") pauseRec(true);
  };
  document.addEventListener("visibilitychange", onHidden);

  const ta = el("textarea", { rows: 10, placeholder: "Transkript oder Stichpunkte Ihres Vortrags …", value: R.answers[key] || "",
    oninput: e => { R.answers[key] = e.target.value; saveRunAnswers(); if (state === "paused") newBase(); } });

  right.append(el("div", { class: "card" },
    el("div", { class: "row", style: "justify-content:space-between" },
      el("h4", {}, "Sprechzeit" + (prep ? " (Vorbereitung " + prep + " s)" : "")), disp),
    el("div", { class: "row", style: "margin-top:8px;align-items:center;flex-wrap:wrap" }, startBtn, pauseBtn, finishBtn, delBtn,
      el("span", { class: "xsmall muted" }, "Vorgabe: " + Math.round(secs / 60 * 10) / 10 + " Minuten")),
    SR
      ? el("div", { class: "col", style: "margin-top:8px;gap:6px" },
          el("div", { class: "row", style: "align-items:center;gap:8px" },
            el("span", { class: "xsmall muted" }, "Live-Transkription:"), langSel),
          liveToggle)
      : el("div", { class: "xsmall muted", style: "margin-top:8px" },
          "Live-Spracherkennung wird von diesem Browser nicht unterstützt (funktioniert z. B. in Chrome/Edge). Aufnahme und manuelles Mitschreiben funktionieren trotzdem."),
    liveBox,
    audioBox,
    el("div", { class: "sep" }),
    el("h4", { text: "Für die Bewertung: schreiben Sie auf, was Sie gesagt haben" }),
    el("p", { class: "xsmall muted", style: "margin:4px 0 8px" },
      SR ? "Während der Aufnahme wird hier automatisch mitgeschrieben — kontrollieren und korrigieren Sie den Text danach kurz." :
      "Die KI kann nur Text bewerten. Sprechen Sie zuerst frei, tippen Sie danach mit — das ist selbst schon gutes Training."),
    ta,
    el("div", { class: "row", style: "margin-top:10px" },
      el("button", { class: "btn sm accent", onclick: () => aiGradeSpeaking(part, c, ta.value, key) }, "✦ Von der KI bewerten lassen"),
      el("span", { class: "xsmall muted", text: R.answers[part.id + ":grade"] != null ? "KI-Bewertung: " + Math.round(R.answers[part.id + ":grade"] * 100) + " %" : "" }))
  ));
}

/* =========================================================================
   FINISH + REVIEW
   ======================================================================= */
function confirmFinish() {
  const R = S.run;
  const missing = totalItems() - answeredCount();
  confirmBox("Modul abgeben?",
    missing > 0 ? missing + " Aufgaben sind noch unbeantwortet. Unbeantwortete Aufgaben zählen als falsch." : "Alle Aufgaben sind beantwortet.",
    finishRun, "Abgeben", missing > 0);
}

function finishRun() {
  const R = S.run;
  if (!R || R.finished) return;
  stopAudio(); stopClock();
  R.finished = true;
  saveRunAnswers();
  clearCheckpoint(R.testId, R.moduleKey); // done — a later restart begins fresh, not mid-way

  const res = scoreModule(R.bp, R.moduleKey, R.test.content[R.moduleKey], R.answers);
  const attempt = {
    id: uid("att"), at: Date.now(), testId: R.testId, testName: R.test.name,
    exam: R.test.exam, level: R.test.level, module: R.moduleKey,
    raw: res.raw, max: res.max, pct: res.pct, normalised: res.normalised, scale: res.scale,
    label: res.label, passed: res.passed, perPart: res.perPart,
    durationSec: Math.round((Date.now() - R.startedAt) / 1000)
  };
  S.attempts.push(attempt); saveAttempts();
  R.result = res; R.reviewing = true;
  go("run");
}

function reviewView() {
  const R = S.run, res = R.result;
  const shell = el("div", {});
  shell.append(el("div", { class: "runbar" },
    el("button", { class: "btn sm ghost", onclick: () => { S.run = null; go("dashboard"); } }, "← Zur Übersicht"),
    el("span", { class: "pill " + MODULE_META[R.moduleKey].cls }, el("span", { class: "mod-dot" }), modName(R.moduleKey)),
    el("div", { class: "spacer" }),

  ));

  const page = el("div", { class: "page" });
  page.append(el("div", { class: "card", style: "margin-bottom:18px" },
    el("div", { class: "row", style: "justify-content:space-between;align-items:flex-end" },
      el("div", {},
        el("h1", { text: modName(R.moduleKey) + " — Ergebnis" }),
        el("div", { class: "small muted", text: R.test.name + " · " + Math.round(res.raw * 10) / 10 + " von " + Math.round(res.max) + " Punkten" })),
      el("div", { style: "text-align:right" },
        el("div", { style: "font-family:var(--font-heading);font-size:38px;line-height:1" , text: String(res.normalised) }),
        el("div", { class: "xsmall muted", text: res.scale === 100 ? "von 100" : "von " + Math.round(res.scale) }))),
    el("div", { class: "bar " + (res.passed ? "good" : "bad"), style: "margin-top:12px" }, el("i", { style: "width:" + Math.round(res.pct * 100) + "%" })),
    el("div", { class: "row", style: "margin-top:10px" },
      el("span", { class: "pill", text: "Bestehensgrenze: " + passLabel(R.bp) }),
      res.pendingHuman ? el("span", { class: "pill accent", text: Math.round(res.pendingHuman) + " Punkte noch unbewertet (Schreiben/Sprechen)" }) : null,
      el("span", { class: "pill", text: "Dauer " + fmtClock(Math.round((Date.now() - R.startedAt) / 1000)) }))
  ));

  /* per part */
  const tb = el("tbody");
  res.perPart.forEach(p => tb.append(el("tr", {},
    el("td", {}, el("b", { text: p.label }), el("div", { class: "xsmall muted", text: p.format })),
    el("td", { text: p.auto ? p.correct + " / " + p.items : "manuell bewertet" }),
    el("td", {}, el("div", { class: "bar", style: "width:120px" }, el("i", { style: "width:" + (p.max ? Math.round(p.got / p.max * 100) : 0) + "%" }))),
    el("td", { text: Math.round(p.got * 10) / 10 + " / " + Math.round(p.max * 10) / 10 }))));
  page.append(el("div", { class: "card", style: "margin-bottom:18px" },
    el("h3", { text: "Ergebnis je Teil" }),
    el("div", { class: "tblwrap" }, el("table", { class: "tbl", style: "margin-top:8px" },
      el("thead", {}, el("tr", {}, el("th", { text: "Teil" }), el("th", { text: "Richtig" }), el("th", { text: "" }), el("th", { text: "Punkte" }))), tb))));

  /* solutions */
  if (S.settings.showSolutionsAfter) {
    page.append(el("h2", { style: "margin:20px 0 10px", text: "Lösungen" }));
    for (const part of R.mod.parts) {
      const c = R.test.content?.[R.moduleKey]?.[part.id];
      if (!c) continue;
      const fmt = FORMATS[part.format] || {};
      const card = el("div", { class: "card", style: "margin-bottom:12px" },
        el("div", { class: "row", style: "justify-content:space-between" },
          el("h3", { text: part.label + " — " + (c.title || part.task) }),
          el("span", { class: "pill mono", text: part.format })));
      if (!fmt.auto) {
        const answer = R.answers[part.id + ":0"] || "";
        card.append(el("p", { class: "small muted", text: "Freie Produktion — hier steht Ihr Text zum Vergleich." }));
        card.append(el("div", { class: "stimulus", style: "white-space:pre-wrap", text: answer || "(nichts geschrieben)" }));
        if (R.answers[part.id + ":feedback"]) card.append(el("div", { class: "card tight", style: "margin-top:10px;white-space:pre-wrap" },
          el("h4", { text: "KI-Rückmeldung" }), el("div", { class: "small", style: "margin-top:6px", text: R.answers[part.id + ":feedback"] })));
        const ann = R.answers[part.id + ":annotated"];
        if (mistakesOn() && Array.isArray(ann) && ann.length) card.append(el("div", { class: "card tight", style: "margin-top:10px" },
          el("h4", { text: "Fehleranalyse" }), renderAnnotated(ann)));
        page.append(card); continue;
      }
      const ex = examDef(R.test.exam);
      const list = el("div", { class: "col", style: "gap:8px" });
      (c.items || []).forEach((it, i) => {
        const given = R.answers[part.id + ":" + i];
        const ok = given !== undefined && String(given) === String(it.answer);
        const show = v => {
          if (v === undefined || v === null || v === "") return "—";
          if (fmt.bank) {
            if (c.personas) {
              const n2 = Number(v);
              return isNaN(n2) ? String(v) : (LETTERS[n2] || v) + (c.personas[n2] ? ") " + c.personas[n2].name : "");
            }
            return String(v);
          }
          const opts = it.options || fmt.fixed || part.fixedOpts || [];
          const n = Number(v);
          return isNaN(n) ? String(v) : (LETTERS[n] || n) + (opts[n] ? ") " + opts[n] : "");
        };
        const row = el("div", { class: "row", style: "align-items:flex-start;gap:10px;padding:7px 0" },
          el("span", { class: "qnum", text: String(i + 1) }),
          el("div", { style: "flex:1;min-width:0" },
            el("div", { class: "small", text: it.prompt }),
            it.why ? el("div", { class: "xsmall muted", style: "margin-top:2px", text: it.why }) : null),
          el("span", { class: "pill " + (ok ? "teal" : "rose"), text: (ok ? "✓ " : "✗ ") + show(given) }),
          !ok ? el("span", { class: "pill teal", text: "Lösung " + show(it.answer) }) : null);
        const itemWrap = el("div", { style: "border-bottom:1px solid var(--color-rule-soft)" }, row);
        if (mistakesOn() && AI.ready()) {
          const explainBox = el("div", { class: "xsmall", style: "margin:0 0 8px 30px;display:none;white-space:pre-wrap" });
          const btn = el("button", { class: "btn sm ghost", style: "margin:0 0 8px 30px",
            onclick: async () => {
              explainBox.style.display = "block";

              await aiExplainItem(part, c, it, given, explainBox, ex.name, R.bp._level);
              btn.disabled = false;
            } }, "✦ Ausführlicher erklären (KI)");
          itemWrap.append(btn, explainBox);
        }
        list.append(itemWrap);
      });
      card.append(list);
      page.append(card);
    }
  }

  /* next actions */
  const chain = R.chain;
  page.append(el("div", { class: "row", style: "margin-top:20px" },
    chain && chain.length
      ? el("button", { class: "btn accent", onclick: () => startRun(R.testId, chain[0], { chain: chain.slice(1) }) },
          "Weiter mit " + modName(chain[0]) + " →")
      : null,
    el("button", { class: "btn", onclick: () => { clearAnswers(R.testId, R.moduleKey); S.run = null; startRun(R.testId, R.moduleKey); } }, "Modul neu versuchen"),
    el("button", { class: "btn", onclick: () => { S.run = null; go("progress"); } }, "Fortschritt ansehen"),
    el("button", { class: "btn ghost", onclick: () => { S.run = null; go("dashboard"); } }, "Zur Übersicht")
  ));
  shell.append(page);
  return shell;
}

/* =========================================================================
   HIGHLIGHT & COMMENT
   Select any text in the material or the transcript during a run to mark it
   or attach a note. Click an existing highlight — or its "Bearbeiten" button
   in the sidebar — to edit the note or remove it. The visible highlight
   lives only in the current render (re-rendering a part, e.g. by switching
   away and back, clears inline marks — a DOM limitation), but every marked
   passage and its comment is saved per part and listed in the
   "Markierungen & Kommentare" card, so nothing is ever lost even across a
   reload, and it stays editable there regardless of the inline mark.
   ======================================================================= */
let selPopNode = null;
let annPanelRefresh = null;

function currentRunPart() {
  const R = S.run;
  if (!R || R.reviewing) return null;
  return R.mod.parts[R.partIndex];
}

function annotationsFor(partId) {
  const R = S.run;
  const key = partId + ":anno";
  if (!Array.isArray(R.answers[key])) R.answers[key] = [];
  return R.answers[key];
}
/** Adds a new entry, or reuses `id` if given (so a mark created alongside it
 *  can carry the same id for later editing). Returns the stored entry. */
function addAnnotation(partId, text, note, id) {
  const entry = { id: id || uid("ann"), text: shorten(text, 300), note: note || "" };
  annotationsFor(partId).push(entry);
  saveRunAnswers();
  refreshAnnPanel();
  return entry;
}
function removeAnnotation(partId, id) {
  const R = S.run, key = partId + ":anno";
  R.answers[key] = (R.answers[key] || []).filter(a => a.id !== id);
  saveRunAnswers();
  refreshAnnPanel();
}
/** Pure update, usable from the edit modal regardless of whether it was
 *  opened from a click on the mark or from the sidebar list. */
function updateAnnotationNote(partId, id, note) {
  const entry = annotationsFor(partId).find(a => a.id === id);
  if (!entry) return null;
  entry.note = note;
  saveRunAnswers();
  refreshAnnPanel();
  return entry;
}
function refreshAnnPanel() { if (annPanelRefresh) annPanelRefresh(); }

function buildAnnotationPanel(part) {
  const listNode = el("div", { class: "col", style: "gap:0;margin-top:8px" });
  function paint() {
    const items = annotationsFor(part.id);
    listNode.innerHTML = "";
    if (!items.length) {
      listNode.append(el("div", { class: "xsmall muted" },
        "Markieren Sie Text im Material links mit der Maus — es erscheinen zwei Knöpfe zum Hervorheben oder Kommentieren. Eine bestehende Markierung lässt sich hier oder durch erneutes Anklicken im Text bearbeiten."));
      return;
    }
    items.forEach(a => listNode.append(el("div", { class: "annitem" },
      el("blockquote", { text: "„" + a.text + "“" }),
      a.note ? el("div", { class: "annnote", text: a.note }) : null,
      el("div", { class: "annrow" },
        el("button", { class: "btn sm ghost", onclick: () => openAnnotationEditor(part.id, a.id, null) }, "Bearbeiten"),
        el("button", { class: "btn sm ghost danger", onclick: () => removeAnnotation(part.id, a.id) }, "Entfernen"))
    )));
  }
  annPanelRefresh = paint;
  paint();
  return el("div", { class: "card tight" }, el("h4", { text: "Markierungen & Kommentare" }), listNode);
}

/** Wraps a live Range in a <mark data-ann-id="…">; falls back silently
 *  (still recorded in the list) when the selection crosses element
 *  boundaries surroundContents can't handle. */
function applyHighlight(range, commented, id) {
  try {
    const mark = document.createElement("mark");
    mark.className = "hl" + (commented ? " commented" : "");
    if (id) mark.setAttribute("data-ann-id", id);
    range.surroundContents(mark);
    return mark;
  } catch (e) { return null; }
}

/** Removes a mark's highlighting but keeps its text in place. */
function unwrapMark(markNode) {
  try {
    const parent = markNode.parentNode;
    if (!parent) return;
    while (markNode.firstChild) parent.insertBefore(markNode.firstChild, markNode);
    parent.removeChild(markNode);
  } catch (e) {}
}

function hideSelPop() { if (selPopNode) { selPopNode.remove(); selPopNode = null; } }

/** Edit or remove an existing annotation. `markNode`, when available (a
 *  direct click on the highlight), lets the inline mark update or disappear
 *  immediately; opening the same editor from the sidebar list works just as
 *  well without it — only the saved entry (and the list) change in that case. */
function openAnnotationEditor(partId, id, markNode) {
  const entry = annotationsFor(partId).find(a => a.id === id);
  if (!entry) return;
  const ta = el("textarea", { rows: 4, placeholder: "Ihr Kommentar …", value: entry.note || "" });
  modal(el("div", {},
    el("h2", { text: "Markierung bearbeiten" }),
    el("blockquote", { class: "small", style: "margin:10px 0 14px;padding-left:10px;border-left:2px solid var(--color-accent);font-style:italic",
      text: "„" + entry.text + "“" }),
    ta,
    el("div", { class: "row", style: "justify-content:space-between;margin-top:14px" },
      el("button", { class: "btn danger", onclick: () => {
        removeAnnotation(partId, id);
        if (markNode) unwrapMark(markNode);
        closeModal();
      } }, "Entfernen"),
      el("div", { class: "row" },
        el("button", { class: "btn", onclick: closeModal }, "Abbrechen"),
        el("button", { class: "btn accent", onclick: () => {
          const note = ta.value.trim();
          updateAnnotationNote(partId, id, note);
          if (markNode) markNode.classList.toggle("commented", !!note);
          closeModal();
        } }, "Speichern"))
    )
  ));
  ta.focus();
}

function openCommentModal(partId, text, range) {
  const id = uid("ann");
  const ta = el("textarea", { rows: 4, placeholder: "Ihr Kommentar …" });
  modal(el("div", {},
    el("h2", { text: "Kommentar hinzufügen" }),
    el("blockquote", { class: "small", style: "margin:10px 0 14px;padding-left:10px;border-left:2px solid var(--color-accent);font-style:italic",
      text: "„" + shorten(text, 220) + "“" }),
    ta,
    el("div", { class: "row", style: "justify-content:flex-end;margin-top:14px" },
      el("button", { class: "btn", onclick: closeModal }, "Abbrechen"),
      el("button", { class: "btn accent", onclick: () => {
        const mark = applyHighlight(range, true, id);
        addAnnotation(partId, text, ta.value.trim(), id);
        closeModal();
        try { window.getSelection().removeAllRanges(); } catch (e) {}
      } }, "Speichern"))
  ));
  ta.focus();
}

function showSelPop(rect, range, text) {
  hideSelPop();
  const part = currentRunPart();
  if (!part) return;
  const pop = el("div", { class: "selpop" },
    el("button", { type: "button", onmousedown: e => e.preventDefault(), onclick: () => {
      const id = uid("ann");
      applyHighlight(range, false, id);
      addAnnotation(part.id, text, "", id);
      hideSelPop();
      try { window.getSelection().removeAllRanges(); } catch (e) {}
    } }, "🖍 Markieren"),
    el("button", { type: "button", onmousedown: e => e.preventDefault(), onclick: () => {
      hideSelPop();
      openCommentModal(part.id, text, range);
    } }, "💬 Kommentieren")
  );
  document.body.appendChild(pop);
  const pw = pop.offsetWidth || 150, top = Math.max(8, rect.top - 46);
  const left = clamp(rect.left + rect.width / 2 - pw / 2, 8, Math.max(8, window.innerWidth - pw - 8));
  pop.style.top = top + "px"; pop.style.left = left + "px";
  selPopNode = pop;
}

function handleSelectionMouseUp(e) {
  if (e.target && e.target.closest && e.target.closest(".selpop")) return;
  const sel = window.getSelection && window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim() || !sel.rangeCount) { hideSelPop(); return; }
  const anchor = sel.anchorNode;
  const el2 = anchor && (anchor.nodeType === 1 ? anchor : anchor.parentElement);
  const pane = el2 && el2.closest && el2.closest(".pane");
  if (!pane || !currentRunPart()) { hideSelPop(); return; }
  const range = sel.getRangeAt(0);
  showSelPop(range.getBoundingClientRect(), range, sel.toString().trim());
}

/** Clicking an existing highlight (a plain click, not a drag-selection)
 *  opens the same editor as the sidebar's "Bearbeiten" button. */
function handleMarkClick(e) {
  const mark = e.target && e.target.closest && e.target.closest("mark.hl");
  if (!mark) return;
  const part = currentRunPart();
  const id = mark.getAttribute("data-ann-id");
  if (!part || !id) return;
  e.preventDefault();
  openAnnotationEditor(part.id, id, mark);
}
</script>
<script>
"use strict";
/* =========================================================================
   AI — talks to any OpenAI-compatible chat/completions endpoint.
   Default configuration targets Google's Gemini compatibility layer:
     https://generativelanguage.googleapis.com/v1beta/openai/
   The key stays in this browser's localStorage and is sent only to that URL.
   ======================================================================= */

const AI = {
  busy: false,
  logNode: null,
  logLines: [],   // persists for the whole session — survives navigating away and back; only "Leeren" clears it
  log(msg, cls = "") {
    const line = "[" + new Date().toLocaleTimeString("de-DE") + "] " + msg;
    AI.logLines.push({ line, cls });
    if (AI.logLines.length > 2000) AI.logLines.splice(0, AI.logLines.length - 2000);
    if (AI.logNode) {
      AI.logNode.append(el("div", { class: cls, text: line }));
      AI.logNode.scrollTop = AI.logNode.scrollHeight;
    }
    console.log("[AI]", msg);
  },
  cfg() { return S.settings.ai; },
  url() {
    let b = (AI.cfg().baseUrl || "").trim();
    if (!b.endsWith("/")) b += "/";
    return b + "chat/completions";
  },
  ready() { return !!(AI.cfg().apiKey || "").trim(); },

  async call(messages, { temperature, maxTokens, json = true } = {}) {
    if (!AI.ready()) throw new Error("Kein API-Schlüssel hinterlegt. Einstellungen → KI.");
    const cfg = AI.cfg();
    const body = {
      model: cfg.model,
      messages,
      temperature: temperature != null ? temperature : Number(cfg.temperature),
      max_tokens: Number(maxTokens || cfg.maxTokens) || 8192
    };
    if (json) body.response_format = { type: "json_object" };

    let res;
    try {
      res = await fetch(AI.url(), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.apiKey.trim() },
        body: JSON.stringify(body)
      });
    } catch (e) {
      throw new Error("Verbindung fehlgeschlagen. Wenn Sie diese Datei als Artefakt oder in einer Sandbox ansehen, blockiert die Sicherheitsrichtlinie externe Aufrufe — öffnen Sie die heruntergeladene HTML-Datei direkt im Browser.");
    }
    if (!res.ok) {
      let detail = "";
      try { const j = await res.json(); detail = j?.error?.message || JSON.stringify(j).slice(0, 300); }
      catch (e) { detail = await res.text().catch(() => ""); }
      throw new Error("HTTP " + res.status + " — " + (detail || res.statusText));
    }
    const data = await res.json();
    const parts = (data?.choices?.[0]?.message?.content);
    let text = "";
    if (typeof parts === "string") text = parts;
    else if (Array.isArray(parts)) text = parts.map(p => p.text || "").join("\n");
    if (!text) throw new Error("Leere Antwort vom Modell.");
    return text;
  },

  parseJSON(text) {
    let s = String(text).trim();
    s = s.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
    const first = Math.min(...[s.indexOf("{"), s.indexOf("[")].filter(i => i >= 0));
    if (isFinite(first) && first > 0) s = s.slice(first);
    const lastBrace = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
    if (lastBrace >= 0) s = s.slice(0, lastBrace + 1);
    return JSON.parse(s);
  },

  async testConnection() {
    const stat = $("#aiStatus");
    if (stat) stat.textContent = "KI: teste …";
    try {
      const txt = await AI.call(
        [{ role: "user", content: 'Antworte ausschließlich mit diesem JSON: {"ok":true,"hallo":"Welt"}' }],
        { temperature: 0, maxTokens: 200 });
      const j = AI.parseJSON(txt);
      if (!j || j.ok !== true) throw new Error("Unerwartete Antwort: " + txt.slice(0, 120));
      AI.cfg().connected = true; saveSettings();
      if (stat) stat.textContent = "KI: verbunden (" + AI.cfg().model + ")";
      toast("Verbindung steht. Modell antwortet korrekt.", "ok");
      return true;
    } catch (e) {
      AI.cfg().connected = false; saveSettings();
      if (stat) stat.textContent = "KI: Fehler";
      toast(e.message, "err", 9000);
      AI.log("Verbindungstest fehlgeschlagen: " + e.message, "er");
      return false;
    }
  }
};

/* =========================================================================
   PROMPT BUILDING — one schema per task format
   ======================================================================= */
const AI_SYSTEM = [
  "Du bist Prüfungsautor:in für deutsche Sprachprüfungen (Goethe-Zertifikat, telc, TestDaF).",
  "Du schreibst ausschließlich eigene, neue Texte. Du zitierst niemals Material aus echten Prüfungssätzen.",
  "Alle Inhalte sind auf Deutsch, orthografisch korrekt, natürlich formuliert und dem Zielniveau genau angemessen.",
  "Du antwortest ausschließlich mit einem einzigen gültigen JSON-Objekt. Kein Fließtext, keine Code-Zäune, keine Erklärungen davor oder danach.",
  "Distraktoren sind plausibel, aber eindeutig falsch. Genau eine Lösung ist richtig.",
  "Jede Lösung ist allein aus dem gegebenen Text ableitbar — kein Weltwissen nötig."
].join(" ");

function schemaFor(part, ex, level) {
  const f = part.format, n = part.items || 1;
  const base = '"title": "kurzer Titel", "instruction": "Arbeitsanweisung auf Deutsch"';
  const why = '"why": "ein Satz: warum diese Lösung richtig ist, mit Textbeleg"';

  if (f === "writing") return `{ ${base}, "prompt": "Aufgabenstellung in 2-4 Sätzen", "bullets": ["Leitpunkt 1","Leitpunkt 2","Leitpunkt 3","Leitpunkt 4"], "words": ${part.words || 150}, "tips": "ein Satz zur Vorgehensweise" }`;

  if (f === "speaking") return `{ ${base}, "prompt": "Sprechaufgabe in 2-3 Sätzen", "bullets": ["Punkt 1","Punkt 2","Punkt 3"]${part.choices ? ', "topics": ["Thema 1","Thema 2"]' : ""}, "seconds": ${part.seconds || 180}${part.prepSec ? ', "prepSec": ' + part.prepSec : ""}, "tips": "ein Satz" }`;

  if (f === "short") return `{ ${base}, ${part.plays ? '"audio": { "plays": ' + part.plays + ', "script": [ { "speaker": "Rolle", "text": "gesprochener Text" } ] }, ' : ""}"items": [ ${n}x { "prompt": "Frage", "answer": "Musterantwort in Stichworten" } ] }`;

  if (f === "gapmc") return `{ ${base}, "passage": "Fließtext mit genau ${n} Lücken, markiert als ___1___ bis ___${n}___ (drei Unterstriche, Zahl, drei Unterstriche). Länge 180-320 Wörter.", "items": [ ${n}x { "prompt": "1", "options": ["a","b","c"${part.format === "gapmc" && level >= "C" ? ',"d"' : ""}], "answer": 0, ${why} } ] }`;

  if (f === "gapbank") return `{ ${base}, "passage": "Fließtext mit genau ${n} Lücken ___1___ bis ___${n}___", "bank": [ ${part.bank || n + 2}x { "key": "a", "text": "einzusetzendes Wort bzw. einzusetzender Satz" } ], "items": [ ${n}x { "prompt": "Lücke 1", "answer": "a", ${why} } ] }`;

  if (f === "match") {
    const bankSize = part.bank || n + 2;
    const personaStyle = part.bankMulti;
    const xNote = part.bankHasX
      ? (personaStyle
          ? ` Für Aussagen, die zu KEINER der ${bankSize} Personen passen, ist 'answer' exakt der String "x" (nicht 0, nicht "0", nicht die höchste Personenzahl) — genau die im Arbeitsauftrag genannte Anzahl an Items bekommt "x".`
          : ` Für Aussagen/Situationen ohne passenden Bankeintrag ist 'answer' exakt der String "x" — genau die im Arbeitsauftrag genannte Anzahl an Items bekommt "x".`)
      : "";
    return `{ ${base}, ${personaStyle
      ? `"personas": [ ${bankSize}x { "name": "Vorname, Rolle", "text": "Forumsbeitrag, 90-140 Wörter" } ]`
      : `"bank": [ ${bankSize}x { "key": "a", "text": "Anzeige/Überschrift/Aussage" } ]`}, "items": [ ${n}x { "prompt": "Aussage bzw. Situation", "answer": "${personaStyle ? "0" : "a"}"${personaStyle ? " (Index der Person als Zahl, 0-basiert)" : ""}, ${why} } ] }` +
      (xNote ? "\n" + xNote : "");
  }

  // choice formats
  const fixed = FORMATS[f]?.fixed || part.fixedOpts;
  const optCount = FORMATS[f]?.opts || 3;
  const stim = part.plays
    ? `"audio": { "plays": ${part.plays}, "script": [ { "speaker": "Sprecherrolle", "text": "gesprochener Text, insgesamt 220-450 Wörter" } ] }`
    : `"passage": "Lesetext, 280-520 Wörter, in Absätze gegliedert"`;
  return `{ ${base}, ${stim}, "items": [ ${n}x { "prompt": "Frage", "options": ${fixed ? JSON.stringify(fixed) : "[" + Array.from({ length: optCount }, (_, i) => '"Option ' + LETTERS[i] + '"').join(", ") + "]"}, "answer": 0, ${why} } ] }`;
}

function partPrompt(bp, mk, part, test) {
  const ex = examDef(test.exam);
  const lines = [
    `Prüfung: ${ex.name} — ${bp.title}`,
    `Modul: ${modName(mk)} (${moduleMinutes(bp.modules[mk])} Minuten insgesamt)`,
    `Aufgabenteil: ${part.label} — ${part.task}`,
    `Vorgabe des Prüfungsformats: ${part.instruction || part.task}`,
    `Aufgabenformat (intern): ${part.format}`,
    `Anzahl der Items: ${FORMATS[part.format]?.essay || FORMATS[part.format]?.spoken ? 1 : part.items}`,
    `Punkte pro Item: ${Math.round((part.ptsPerItem || 0) * 100) / 100}`,
    `Bearbeitungszeit: ca. ${part.minutes} Minuten`,
    part.plays ? `Der Hörtext wird ${part.plays}× abgespielt — passe die Informationsdichte daran an.` : null,
    part.words ? `Ziel-Wortzahl der Lernenden: ca. ${part.words}.` : null,
    `Themenbereiche dieser Prüfung: ${bp.topics}`,
    "",
    "Erzeuge genau diesen Aufgabenteil als JSON mit dieser Struktur (die Notation 'Nx {…}' bedeutet: N Objekte dieser Form in einem Array):",
    schemaFor(part, ex, test.level),
    "",
    "Wichtige Regeln:",
    "- 'answer' bei Optionsaufgaben ist der 0-basierte Index der richtigen Option, als Zahl.",
    "- 'answer' bei Zuordnungen mit 'bank' ist der Buchstabenschlüssel als String.",
    "- Bei Lückentexten muss die Zahl der Marker ___N___ exakt der Zahl der Items entsprechen.",
    "- Verteile die richtigen Lösungen gleichmäßig über die Optionen, nicht überwiegend auf eine Position.",
    "- Nenne keine realen Personen des öffentlichen Lebens und erfinde keine Statistiken, die nach Tatsachenbehauptung klingen; bleibe bei plausiblen, klar fiktiven Beispielen.",
    "- Antworte NUR mit dem JSON-Objekt."
  ].filter(Boolean);
  return lines.join("\n");
}

/* =========================================================================
   VALIDATION / REPAIR
   ======================================================================= */
function validatePart(part, obj) {
  const f = part.format, fmt = FORMATS[f] || {};
  const problems = [];
  if (!obj || typeof obj !== "object") return ["Keine Objektstruktur erhalten."];

  if (fmt.essay) { if (!obj.prompt) problems.push("prompt fehlt"); return problems; }
  if (fmt.spoken) { if (!obj.prompt) problems.push("prompt fehlt"); return problems; }

  if (!Array.isArray(obj.items) || !obj.items.length) return ["items fehlen"];
  const want = part.items || obj.items.length;
  if (obj.items.length !== want) problems.push("erwartet " + want + " Items, erhalten " + obj.items.length);

  if (fmt.cloze) {
    const marks = (String(obj.passage || "").match(/___\d+___/g) || []).filter(m => m !== "___0___");
    if (!obj.passage) problems.push("passage fehlt");
    else if (marks.length !== obj.items.length) problems.push("Lückenmarker: " + marks.length + " im Text, " + obj.items.length + " Items");
  }
  if (fmt.bank && !obj.bank && !obj.personas) problems.push("bank/personas fehlt");

  obj.items.forEach((it, i) => {
    if (it.answer === undefined || it.answer === null || it.answer === "") problems.push("Item " + (i + 1) + ": answer fehlt");
    if (!fmt.bank && !fmt.text && !fmt.cloze && !Array.isArray(it.options)) problems.push("Item " + (i + 1) + ": options fehlen");
    const isX = typeof it.answer === "string" && it.answer.trim().toLowerCase() === "x";
    if (isX && !part.bankHasX) problems.push("Item " + (i + 1) + ": answer \"x\" ist bei diesem Teil nicht vorgesehen");
    if (!isX && Array.isArray(it.options) && typeof it.answer === "number" && (it.answer < 0 || it.answer >= it.options.length))
      problems.push("Item " + (i + 1) + ": answer liegt außerhalb der Optionen");
  });
  return problems;
}

function normalisePart(part, obj) {
  const fmt = FORMATS[part.format] || {};
  // personas-based matching: allow numeric or letter answers
  if (obj.personas && Array.isArray(obj.items)) {
    obj.items.forEach(it => {
      /* "x" ("passt zu niemandem") is a sentinel, not a person letter — must
         never be run through the letter→index conversion below, or it gets
         mistaken for the 24th persona (LETTERS.indexOf("x") === 23) and then
         rejected as "out of range" even though it was the correct answer. */
      if (typeof it.answer === "string" && it.answer.trim().toLowerCase() === "x") it.answer = "x";
      else if (typeof it.answer === "string" && /^[a-z]$/i.test(it.answer)) it.answer = LETTERS.indexOf(it.answer.toLowerCase());
      it.options = it.options || obj.personas.map(p => p.name);
    });
  }
  if (fmt.bank && obj.bank && Array.isArray(obj.items)) {
    obj.items.forEach(it => { if (typeof it.answer === "number") it.answer = LETTERS[it.answer] || String(it.answer); });
  }
  if (obj.audio && obj.audio.script && !Array.isArray(obj.audio.script)) obj.audio.script = [{ speaker: "", text: String(obj.audio.script) }];
  if (obj.audio && !obj.audio.plays) obj.audio.plays = part.plays || 1;
  if (fmt.essay && !obj.words) obj.words = part.words;
  if (fmt.spoken && !obj.seconds) obj.seconds = part.seconds;
  return obj;
}

/* =========================================================================
   GENERATION
   ======================================================================= */
async function aiGeneratePart(testId, mk, partId, silent = false) {
  const test = testById(testId);
  if (!test) return;
  if (!AI.ready()) { go("settings"); return toast("Bitte zuerst den API-Schlüssel eintragen.", "err"); }
  const bp = blueprint(test.exam, test.level);
  const part = bp.modules[mk].parts.find(p => p.id === partId);
  if (!part) return;

  const label = modName(mk) + " " + part.label;
  AI.log("Generiere " + label + " (" + part.format + ", " + part.items + " Items) …", "dim");
  const t0 = Date.now();
  let lastErr = null;

  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const messages = [
        { role: "system", content: AI_SYSTEM },
        { role: "user", content: partPrompt(bp, mk, part, test) }
      ];
      if (lastErr) messages.push({ role: "user", content: "Der vorige Versuch war fehlerhaft: " + lastErr + ". Erzeuge das JSON erneut und behebe genau diese Punkte." });
      const raw = await AI.call(messages, { temperature: attempt === 1 ? undefined : 0.5 });
      let obj = AI.parseJSON(raw);
      if (Array.isArray(obj)) obj = obj[0];
      obj = normalisePart(part, obj);
      const problems = validatePart(part, obj);
      if (problems.length) { lastErr = problems.join("; "); AI.log("  Versuch " + attempt + " verworfen: " + lastErr, "er"); continue; }

      test.content[mk] = test.content[mk] || {};
      test.content[mk][partId] = obj;
      test.source = test.source === "seed" ? "seed" : "ai";
      saveTests();
      AI.log("  ✓ " + label + " fertig in " + Math.round((Date.now() - t0) / 100) / 10 + " s", "ok");
      if (!silent) { toast(label + " generiert.", "ok"); refresh(); }
      return true;
    } catch (e) {
      lastErr = e.message;
      AI.log("  Versuch " + attempt + " fehlgeschlagen: " + e.message, "er");
      if (/HTTP 4|Schlüssel|Verbindung/.test(e.message)) break;
    }
  }
  AI.log("  ✗ " + label + " konnte nicht erzeugt werden.", "er");
  if (!silent) toast(label + ": " + (lastErr || "fehlgeschlagen"), "err", 8000);
  return false;
}

async function aiGenerateModule(testId, mk, silent = false) {
  const test = testById(testId);
  if (!test) return toast("Kein Modelltest ausgewählt.", "err");
  if (!AI.ready()) { go("settings"); return toast("Bitte zuerst den API-Schlüssel eintragen.", "err"); }
  if (AI.busy) return toast("Es läuft bereits eine Generierung.", "err");
  const bp = blueprint(test.exam, test.level);
  const parts = bp.modules[mk].parts;

  AI.busy = true;
  if (!silent) openAIConsole("Generiere " + modName(mk) + " — " + parts.length + " Teile");
  let ok = 0;
  for (const p of parts) {
    setAIProgress(ok / parts.length, modName(mk) + " " + p.label);
    if (await aiGeneratePart(testId, mk, p.id, true)) ok++;
  }
  setAIProgress(1, "fertig");
  AI.busy = false;
  AI.log("Modul " + modName(mk) + ": " + ok + " von " + parts.length + " Teilen erzeugt.", ok === parts.length ? "ok" : "er");
  toast(modName(mk) + ": " + ok + "/" + parts.length + " Teile generiert.", ok === parts.length ? "ok" : "err");
  if (!silent) refresh();
  return ok;
}

async function aiGenerateAll(testId) {
  const test = testById(testId || S.settings.testId);
  if (!test) return toast("Kein Modelltest ausgewählt.", "err");
  if (!AI.ready()) { go("settings"); return toast("Bitte zuerst den API-Schlüssel eintragen.", "err"); }
  if (AI.busy) return toast("Es läuft bereits eine Generierung.", "err");
  const bp = blueprint(test.exam, test.level);
  const keys = moduleKeys(bp);
  const allParts = keys.reduce((s, k) => s + bp.modules[k].parts.length, 0);

  confirmBox("Kompletten Modelltest generieren?",
    "Es werden " + allParts + " Aufgabenteile in " + keys.length + " Modulen erzeugt. Das dauert je nach Modell einige Minuten und überschreibt die vorhandenen Inhalte von „" + test.name + "“.",
    async () => {
      AI.busy = true;
      openAIConsole("Kompletter Modelltest — " + allParts + " Teile");
      let done = 0, ok = 0;
      for (const mk of keys) {

      toast("Modelltest fertig: " + ok + "/" + allParts + " Teile.", ok === allParts ? "ok" : "err", 7000);
    }, "Generieren", false);
}

/* =========================================================================
   KI-FEHLERANALYSE — geteilte Hilfsfunktionen für Schreiben, Sprechen,
   Lesen und Hören
   ======================================================================= */
function mistakeCfg() { return S.settings.mistakeAnalysis; }
function mistakesOn() { return !!mistakeCfg().enabled; }

/* Sprache für Erklärungen/Kommentare der KI. Leer = Deutsch (Standard). */
function explainLang() { return String(mistakeCfg().explainLang || "").trim(); }
function explainLangLine() {
  const lang = explainLang();
  if (!lang) return "Schreibe alle Erklärungen, Kommentare, Bewertungen und Anmerkungen auf Deutsch.";
  return `Schreibe alle Erklärungen, Kommentare, Anmerkungen, Stärken, Verbesserungsvorschläge und die Gesamtbeurteilung ausschließlich auf ${lang}, verständlich für jemanden, der besser ${lang} als Deutsch kann. ` +
    `Beispielsätze/Zitate aus dem deutschen Text, die überarbeitete Fassung ("corrected") und alle Prüfungsinhalte selbst (Text, Aufgaben, einzufügende Wörter/Sätze) bleiben auf Deutsch — nur die Erklärungen drumherum werden übersetzt.`;
}

/* Wie streng/wonach gewichtet werden soll, abhängig vom Prüfungsniveau. */
function levelWeightLine(level) {
  const lv = String(level || "").toUpperCase();
  if (lv.startsWith("A")) return `Niveau ${lv}: Gewichte Grundfehler am stärksten — Verbkonjugation, Wortstellung, Artikel/Kasus, elementare Rechtschreibung. Schon einfache korrekte Sätze zählen positiv; Stil und Register spielen fast keine Rolle.`;
  if (lv.startsWith("B1")) return `Niveau ${lv}: Grammatik- (Kasus, Zeiten, Nebensätze) und Wortschatzfehler zählen deutlich. Register/Konnektoren werden wichtiger, aber weniger streng bewertet als ab B2.`;
  if (lv.startsWith("B2")) return `Niveau ${lv}: Grammatikfehler und unpassender Wortschatz zählen klar. Zusätzlich werden Kohärenz, Satzbauvielfalt und ein zur Aufgabe passendes Register erwartet.`;
  if (lv.startsWith("C1")) return `Niveau ${lv}: Kleine, vereinzelte Grammatikfehler wiegen weniger schwer als unpassender Ton, ungenaue Wortwahl, schwache Kohärenz oder zu einfache Satzstrukturen.`;
  if (lv.startsWith("C2") || lv.includes("TDN") || lv.includes("4") || lv.includes("5")) return `Höchstes Niveau (${lv}): Bewerte vor allem Präzision, Register, Idiomatik, Textaufbau und Nuancen. Einzelne kleine Flüchtigkeitsfehler fallen kaum ins Gewicht, ungenaue oder unidiomatische Formulierungen dagegen schon.`;
  return `Gewichte Fehler passend zum genannten Niveau ${lv || "des Tests"}.`;
}

const ANNOTATION_SCHEMA =
  `"annotated": [ { "t": "ok"|"wrong"|"extra"|"missing"|"punct"|"tone"|"style", "s": "Textstück", "note": "kurze Erklärung" } ]`;
const ANNOTATION_RULES = [
  "Zusätzlich zerlegst du den Kandidatentext für die farbliche Fehleranalyse in 'annotated': eine geordnete Liste kleiner Textstücke (Wort oder kurze Wortgruppe), die aneinandergereiht (ohne die 'missing'-Stücke) wieder den Originaltext ergeben, inklusive Leerzeichen/Umbrüchen.",
  "t:'ok' für fehlerfreien Text (kein 'note' nötig). t:'wrong' für ein falsches Wort/eine falsche Form — 's' ist die falsche Stelle wie im Original, 'note' nennt kurz Fehlerart und die richtige Form. t:'extra' für ein überflüssiges Wort, das ersatzlos gestrichen werden sollte. t:'missing' für eine fehlende Stelle — 's' enthält das fehlende Wort bzw. die fehlende Wortgruppe, die dort eingefügt werden sollte (im Original nicht vorhanden). t:'punct' für Zeichensetzungsfehler. t:'tone' für Ton-/Registerprobleme (z. B. zu informell/zu förmlich für die Aufgabe). t:'style' für stilistisch schwache, aber nicht falsche Stellen (Wiederholungen, ungenaue Wortwahl) — 'note' nennt eine bessere Formulierung.",
  "Erfinde keine zusätzlichen Fehler nur um etwas zu markieren — ein sehr guter Text kann fast nur aus 'ok'-Stücken bestehen."
].join(" ");

/* Farbige Markierungen im Fließtext rendern; Klick auf eine Markierung
   zeigt die Erklärung im Erläuterungsfeld darunter. */
const MARK_META = {
  wrong:   { cls: "mk-wrong",   label: "Falsche Form / falsches Wort", swatch: "var(--color-rose)" },
  extra:   { cls: "mk-extra",   label: "Überflüssig — entfernen",      swatch: "var(--color-rose)" },
  missing: { cls: "mk-missing", label: "Fehlt — hier einfügen",        swatch: "var(--color-good)" },
  punct:   { cls: "mk-punct",   label: "Zeichensetzung",               swatch: "var(--color-amber)" },
  tone:    { cls: "mk-tone",    label: "Ton / Register",               swatch: "var(--color-indigo)" },
  style:   { cls: "mk-style",   label: "Stil — geht besser",           swatch: "var(--color-plum)" }
};

function renderAnnotated(segments) {
  const wrap = el("div", {});
  const used = new Set((segments || []).map(s => s.t).filter(t => MARK_META[t]));
  if (used.size) {
    wrap.append(el("div", { class: "mkleg" }, Array.from(used).map(t =>
      el("span", {}, el("i", { style: "background:" + MARK_META[t].swatch }), MARK_META[t].label))));
  }
  const note = el("div", { class: "mk-note", hidden: true });
  const textEl = el("div", { class: "mktext" });
  (segments || []).forEach(seg => {
    const meta = MARK_META[seg.t];
    if (!meta) { textEl.append(document.createTextNode(String(seg.s || ""))); return; }
    const span = el("span", { class: "mk " + meta.cls, tabindex: "0",
      onclick: () => {
        note.hidden = false;
        note.innerHTML = "";
        note.append(el("b", { text: meta.label + ": " }), el("span", { text: seg.note || "—" }));
      } }, String(seg.s || ""));
    textEl.append(span);
  });
  wrap.append(textEl, note);
  return wrap;
}

/* Ausführliche KI-Erklärung für ein einzelnes Lesen/Hören/Bausteine-Item
   (warum die Lösung richtig ist, und warum die gewählte Antwort falsch war). */
async function aiExplainItem(part, c, it, given, host, examName, level) {
  if (!AI.ready()) { host.textContent = "Kein API-Schlüssel hinterlegt (Einstellungen → KI)."; return; }
  host.textContent = "Die KI erklärt …";
  const fmt = FORMATS[part.format] || {};
  const opts = it.options || fmt.fixed || part.fixedOpts || [];
  const showAns = v => {
    if (v === undefined || v === null || v === "") return "—";
    if (c.personas) { const n = Number(v); return isNaN(n) ? String(v) : (LETTERS[n] || v) + (c.personas[n] ? ") " + c.personas[n].name : ""); }
    if (fmt.bank) return String(v);
    const n = Number(v);
    return isNaN(n) ? String(v) : (LETTERS[n] || n) + (opts[n] ? ") " + opts[n] : "");
  };
  const prompt = [
    `Erkläre einer/einem Deutschlernenden auf Niveau ${level} bei einer Aufgabe im Stil von ${examName}, warum eine Lösung richtig und eine andere falsch ist.`,
    `Aufgabe/Item: ${it.prompt}`,
    opts.length ? "Antwortmöglichkeiten: " + opts.map((o, oi) => LETTERS[oi] + ") " + o).join(" | ") : "",
    `Richtige Lösung: ${showAns(it.answer)}`,
    given !== undefined && given !== null && given !== "" ? `Von der Kandidatin/dem Kandidaten gewählt: ${showAns(given)}` : "Wurde nicht beantwortet.",
    it.why ? `Bereits vorliegende Kurzbegründung: ${it.why}` : "",
    "Erkläre in 2 bis 4 Sätzen, mit Beleg aus der Aufgabe, warum die richtige Lösung stimmt, und — falls falsch gewählt wurde — woran die gewählte Antwort erkennbar scheitert.",
    explainLangLine(),
    'Antworte NUR mit diesem JSON: { "explanation": "..." }'
  ].filter(Boolean).join("\n");
  try {
    const raw = await AI.call([
      { role: "system", content: "Du bist eine geduldige Deutschlehrerin. Du antwortest ausschließlich mit gültigem JSON." },
      { role: "user", content: prompt }
    ], { temperature: 0.3, maxTokens: 700 });
    const j = AI.parseJSON(raw);
    host.textContent = j.explanation || "Keine Erklärung erhalten.";
  } catch (e) {
    host.textContent = "Fehler: " + e.message;
  }
}

    : ex.id === "testdaf"
      ? ["Gesamteindruck", "Aufgabenbewältigung", "Sprachliche Realisierung (Breite und Korrektheit)"]

    "---",

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prüfungsstudio — Goethe · telc · TestDaF</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#16171b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prüfungsstudio">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Design tokens — carried over from the Prepdaf workspace
   ============================================================ */
:root{
  --pad:20px; --gap:12px; --row:10px;
  --font-heading:"IBM Plex Serif",Georgia,serif;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --color-bg:#faf9f5; --color-bg-2:#f0ede4; --color-surface:#ffffff;
  --color-card-back:#efeade; --color-surface-2:#faf9f5;
  --color-ink:#17181c; --color-ink-2:#34363d;
  --color-on-ink:#ffffff; --color-on-ink-muted:rgba(255,255,255,.7);
  --color-muted:#6F6A61; --color-faint:#b5b7bd;
  --color-rule:#e4ded0; --color-rule-soft:#ece7dd;
  --color-accent:#c77416; --color-accent-soft:#fbeccf; --color-accent-softer:#fdf6e7;
  --color-indigo:#3d4ad6; --color-indigo-soft:#e8eaff;
  --color-teal:#2b8a86; --color-teal-soft:#d4ece9;
  --color-amber:#c77416; --color-amber-soft:#fbeccf;
  --color-rose:#c93a60; --color-rose-soft:#fadfe5;
  --color-plum:#7c3aa8; --color-plum-soft:#eddfef;
  --color-lime:#7a9a1f; --color-lime-soft:#eaf2cf;
  --color-good:#2b8a86; --color-danger:#c93a60;
  --radius:10px; --radius-lg:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --color-bg:#16171b; --color-bg-2:#1f2025; --color-surface:#1c1d22;
  --color-surface-2:#26272d; --color-card-back:#101115;
  --color-ink:#f4f2ec; --color-ink-2:#cdcbc4;
  --color-on-ink:#17181c; --color-on-ink-muted:rgba(23,24,28,.7);
  --color-muted:#9a968d; --color-faint:#6a6862;
  --color-rule:#33343b; --color-rule-soft:#2a2b31;
  --color-accent:#e08c2a; --color-accent-soft:#3a2c14; --color-accent-softer:#2b251b;
  --color-indigo:#8b95f0; --color-indigo-soft:#262a44;
  --color-teal:#4fb6b1; --color-teal-soft:#17322f;
  --color-amber:#e08c2a; --color-amber-soft:#3a2c14;
  --color-rose:#e5789a; --color-rose-soft:#3a1f28;
  --color-plum:#b587dc; --color-plum-soft:#2c1f38;
  --color-lime:#a9c65a; --color-lime-soft:#262e14;
  --color-good:#4fb6b1; --color-danger:#e5789a;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--color-bg); color:var(--color-ink);
  font-family:var(--font-sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-heading); font-weight:500; margin:0; line-height:1.25}
h1{font-size:28px; letter-spacing:-.01em}
h2{font-size:21px}
h3{font-size:17px}
h4{font-size:15px}
p{margin:0 0 10px}
a{color:var(--color-accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--color-accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:248px 1fr; min-height:100vh}
.sidebar{
  border-right:1px solid var(--color-rule); background:var(--color-surface);
  padding:18px 14px; display:flex; flex-direction:column; gap:18px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:baseline; gap:8px; padding:2px 8px 0}
.brand b{font-family:var(--font-heading); font-size:19px; font-weight:600; letter-spacing:-.01em}
.brand span{font-size:10px; color:var(--color-muted); border:1px solid var(--color-rule); padding:1px 5px; border-radius:99px}
.navgroup{display:flex; flex-direction:column; gap:1px}
.navgroup>.lbl{font-size:11px; color:var(--color-muted); padding:6px 8px 4px; letter-spacing:.02em}
.navitem{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px;
  background:none; border:0; width:100%; text-align:left; cursor:pointer;
  color:var(--color-ink-2); font-size:14px; transition:background .12s;
}
.navitem:hover{background:var(--color-bg-2)}
.navitem[aria-current="true"]{background:var(--color-accent-soft); color:var(--color-ink); font-weight:500}
.navitem .ic{width:16px; text-align:center; opacity:.8; font-size:13px}
.navitem .tag{margin-left:auto; font-size:10px; color:var(--color-muted); background:var(--color-bg-2); padding:1px 6px; border-radius:99px}
.sidefoot{margin-top:auto; border-top:1px solid var(--color-rule-soft); padding-top:12px; display:flex; flex-direction:column; gap:8px}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; flex-wrap:nowrap; gap:10px 12px; padding:12px 24px;
  border-bottom:1px solid var(--color-rule); background:var(--color-surface);
  position:sticky; top:0; z-index:40;
}
.topbar .ctx{display:flex; align-items:center; gap:8px; flex:0 1 auto; flex-wrap:nowrap; min-width:0; overflow-x:auto; scrollbar-width:thin}
.topbar .ctx > *{flex:0 0 auto}
.topbar .spacer{flex:1 1 0; min-width:0}
.topbar #passPill,.topbar #quickGenBtn{flex:none; white-space:nowrap}
.libctx{display:contents}
.libctx:empty{display:none}
.libctx select{width:auto; max-width:200px; min-width:84px; flex:0 1 auto}
.libctx .pill,.libctx button,.libctx span{flex:none}
.page{padding:26px 24px 64px; max-width:1180px; width:100%}
.page.wide{max-width:1560px; margin:0 auto}

/* ---------- primitives ---------- */
.card{
  background:var(--color-surface); border:1px solid var(--color-rule);
  border-radius:var(--radius-lg); padding:18px;
}
.card.tight{padding:14px}
.card-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:12px}
.card-head .grow{flex:1; min-width:0}
.muted{color:var(--color-muted)}
.small{font-size:13px}
.xsmall{font-size:12px}
.mono{font-family:var(--font-mono); font-size:12px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.col{display:flex; flex-direction:column; gap:10px}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sep{height:1px; background:var(--color-rule-soft); margin:14px 0}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 13px;
  border-radius:9px; border:1px solid var(--color-rule); background:var(--color-surface);
  color:var(--color-ink); cursor:pointer; font-size:14px; transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--color-muted)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--color-ink); color:var(--color-on-ink); border-color:var(--color-ink)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--color-accent); color:#17181c; border-color:var(--color-accent); font-weight:500}
.btn.danger{color:var(--color-danger); border-color:var(--color-danger)}
.btn.ghost{background:none; border-color:transparent}
.btn.ghost:hover{background:var(--color-bg-2)}
.btn.ghost.danger{color:var(--color-danger)}
.btn.ghost.danger:hover{background:var(--color-rose-soft)}
.btn.sm{padding:5px 9px; font-size:13px; border-radius:7px}
.btn.block{width:100%; justify-content:center}

.pill{
  display:inline-flex; align-items:center; gap:5px; font-size:12px;
  padding:2px 9px; border-radius:99px; background:var(--color-bg-2); color:var(--color-ink-2);
  border:1px solid var(--color-rule-soft); white-space:nowrap;
}
.pill.accent{background:var(--color-accent-soft); color:var(--color-accent); border-color:transparent}
.pill.teal{background:var(--color-teal-soft); color:var(--color-teal); border-color:transparent}
.pill.rose{background:var(--color-rose-soft); color:var(--color-rose); border-color:transparent}
.pill.indigo{background:var(--color-indigo-soft); color:var(--color-indigo); border-color:transparent}
.pill.plum{background:var(--color-plum-soft); color:var(--color-plum); border-color:transparent}
.pill.lime{background:var(--color-lime-soft); color:var(--color-lime); border-color:transparent}

label.field{display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--color-muted)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  background:var(--color-bg); border:1px solid var(--color-rule); border-radius:9px;
  padding:8px 10px; font-size:14px; color:var(--color-ink); width:100%;
}
textarea{resize:vertical; line-height:1.6}
select{cursor:pointer}
input[type=range]{width:100%; accent-color:var(--color-accent)}

.seg{display:inline-flex; border:1px solid var(--color-rule); border-radius:9px; overflow:hidden; background:var(--color-surface)}
.seg button{border:0; background:none; padding:6px 11px; cursor:pointer; font-size:13px; color:var(--color-muted)}
.seg button[aria-pressed="true"]{background:var(--color-accent-soft); color:var(--color-ink); font-weight:500}

.bar{height:6px; border-radius:99px; background:var(--color-bg-2); overflow:hidden}
.bar>i{display:block; height:100%; background:var(--color-accent); border-radius:99px; transition:width .3s}
.bar.good>i{background:var(--color-good)}
.bar.bad>i{background:var(--color-danger)}

table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
table.tbl th{text-align:left; font-weight:500; color:var(--color-muted); font-size:12px; padding:7px 8px; border-bottom:1px solid var(--color-rule)}
table.tbl td{padding:9px 8px; border-bottom:1px solid var(--color-rule-soft); vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}

.empty{
  border:1px dashed var(--color-rule); border-radius:var(--radius-lg);
  padding:28px; text-align:center; color:var(--color-muted);
}

/* ---------- module accent colours ---------- */
.mod-lesen{--m:var(--color-indigo); --ms:var(--color-indigo-soft)}
.mod-hoeren{--m:var(--color-teal); --ms:var(--color-teal-soft)}
.mod-schreiben{--m:var(--color-amber); --ms:var(--color-amber-soft)}
.mod-sprechen{--m:var(--color-rose); --ms:var(--color-rose-soft)}
.mod-bausteine{--m:var(--color-plum); --ms:var(--color-plum-soft)}
.mod-dot{width:8px; height:8px; border-radius:99px; background:var(--m,var(--color-accent))}

.modcard{
  background:var(--color-surface); border:1px solid var(--color-rule);
  border-radius:var(--radius-lg); padding:16px; display:flex; flex-direction:column; gap:10px;
  border-top:3px solid var(--m,var(--color-accent));
}

/* ---------- collapsible sidebar ---------- */
.shell.nav-hidden{grid-template-columns:0 1fr}
.shell.nav-hidden .sidebar{
  transform:translateX(-100%); border-right:0; padding-left:0; padding-right:0;
  width:248px; overflow:hidden;
}
.sidebar{transition:transform .18s ease}
#navToggle{flex:0 0 auto}

/* ---------- split panes (stimulus | questions) ---------- */
.split{display:grid; gap:18px; align-items:start}
.split[data-ratio="50-50"]{grid-template-columns: minmax(240px,1fr) minmax(240px,1fr)}
.split[data-ratio="30-70"]{grid-template-columns: minmax(220px,3fr) minmax(260px,7fr)}
.split[data-ratio="70-30"]{grid-template-columns: minmax(260px,7fr) minmax(220px,3fr)}
.split[data-ratio="100"]{grid-template-columns:1fr}
.split > .pane{min-width:0; display:flex; flex-direction:column; gap:12px}
.split:not([data-ratio="100"]) > .pane{
  max-height:calc(100vh - 150px); overflow-y:auto; overscroll-behavior:contain;
  padding-right:6px;
}
.split:not([data-ratio="100"]) > .pane::-webkit-scrollbar{width:8px}
.split:not([data-ratio="100"]) > .pane::-webkit-scrollbar-thumb{background:var(--color-rule); border-radius:99px}
.pane-label{
  font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--color-muted);
  border-bottom:1px solid var(--color-rule-soft); padding-bottom:5px; margin-bottom:2px;
  position:sticky; top:0; background:var(--color-bg); z-index:2;
}
.split[data-ratio="100"] .pane-label{position:static}
.ratioseg button{min-width:44px; font-family:var(--font-mono); font-size:11.5px; padding:5px 7px}

/* ---------- highlight & comment ---------- */
.hl{background:var(--color-accent-soft); border-radius:3px; padding:0 1px; cursor:pointer; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.hl.commented{box-shadow:inset 0 -3px 0 var(--color-accent)}
.selpop{
  position:fixed; z-index:180; display:flex; gap:2px; padding:4px;
  background:var(--color-ink); border-radius:9px; box-shadow:0 6px 20px rgba(0,0,0,.32);
}
.selpop button{
  background:none; border:0; color:var(--color-on-ink); font-size:12.5px; padding:6px 9px;
  border-radius:6px; cursor:pointer; white-space:nowrap;
}
.selpop button:hover{background:rgba(255,255,255,.16)}
.annitem{border:1px solid var(--color-rule); border-radius:8px; padding:8px 9px; font-size:12.5px}
.annitem+.annitem{margin-top:7px}
.annitem blockquote{margin:0 0 4px; padding-left:8px; border-left:2px solid var(--color-accent); color:var(--color-ink-2); font-style:italic}
.annitem .annnote{color:var(--color-muted); white-space:pre-wrap}
.annitem .annrow{display:flex; justify-content:flex-end; margin-top:5px}

/* ---------- exam runner ---------- */
.runner{display:grid; grid-template-columns:1fr 268px; gap:20px; align-items:start}
.tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.runbar{
  display:flex; align-items:center; gap:12px; padding:10px 24px;
  border-bottom:1px solid var(--color-rule); background:var(--color-surface);
  position:sticky; top:0; z-index:45;
}
.clock{font-family:var(--font-mono); font-size:20px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.clock.warn{color:var(--color-accent)}
.clock.crit{color:var(--color-danger)}
.partnav{display:flex; gap:6px; flex-wrap:wrap}
.partnav button{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--color-rule);
  background:var(--color-surface); cursor:pointer; font-size:13px; color:var(--color-muted);
}
.partnav button[aria-current="true"]{background:var(--color-ink); color:var(--color-on-ink); border-color:var(--color-ink)}
.partnav button.done{border-color:var(--color-good); color:var(--color-good)}

.stimulus{
  background:var(--color-bg-2); border:1px solid var(--color-rule-soft);
  border-radius:var(--radius); padding:16px 18px; font-family:var(--font-heading);
  font-size:15.5px; line-height:1.75; max-width:70ch;
}
.stimulus h4{font-family:var(--font-heading); margin-bottom:8px}
.stimulus .gapmark{
  display:inline-block; min-width:26px; text-align:center; font-family:var(--font-mono);
  font-size:12px; background:var(--color-accent-soft); color:var(--color-accent);
  border-radius:5px; padding:0 5px; margin:0 2px;
}
.persona{border-left:3px solid var(--m,var(--color-accent)); padding-left:12px; margin-bottom:14px}

.q{border:1px solid var(--color-rule); border-radius:var(--radius); padding:13px 15px; background:var(--color-surface)}
.q+.q{margin-top:10px}
.q .qhead{display:flex; gap:9px; align-items:baseline; margin-bottom:8px}
.q .qnum{
  font-family:var(--font-mono); font-size:11px; min-width:24px; height:20px; padding:0 6px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--color-bg-2); border-radius:6px; color:var(--color-muted);
}
.opts{display:flex; flex-direction:column; gap:5px}
.opt{
  display:flex; gap:9px; align-items:flex-start; padding:7px 10px; border-radius:8px;
  border:1px solid transparent; cursor:pointer; font-size:14px;
}
.opt:hover{background:var(--color-bg-2)}
.opt input{margin:3px 0 0; accent-color:var(--color-accent)}
.opt.sel{background:var(--color-accent-softer); border-color:var(--color-accent)}
.opt .k{font-family:var(--font-mono); font-size:12px; color:var(--color-muted); min-width:12px}
.opt.correct{background:var(--color-teal-soft); border-color:var(--color-good)}
.opt.wrong{background:var(--color-rose-soft); border-color:var(--color-danger)}
.optrow{display:flex; gap:6px; flex-wrap:wrap}
.optrow .opt{border:1px solid var(--color-rule); min-width:44px; justify-content:center}

.side{display:flex; flex-direction:column; gap:14px; position:sticky; top:74px}
.umlauts{display:flex; gap:4px; flex-wrap:wrap}
.umlauts button{
  min-width:32px; padding:4px 8px; border-radius:7px; border:1px solid var(--color-rule);
  background:var(--color-surface); cursor:pointer; font-family:var(--font-heading);
}
.wordcount{font-family:var(--font-mono); font-size:12px; color:var(--color-muted)}
.wordcount.ok{color:var(--color-good)}
.wordcount.low{color:var(--color-accent)}

.audioctl{display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:var(--radius);
  background:var(--color-teal-soft); border:1px solid transparent; flex-wrap:wrap}
.ring{position:relative; flex:0 0 auto}
.audiomain{display:flex; flex-direction:column; gap:6px; flex:1 1 220px; min-width:200px}
.audiomain button.seek{width:34px; padding:0 4px; justify-content:center; flex:0 0 auto}
.audiomain .row{gap:6px; flex-wrap:nowrap}
input[type=range].scrub{width:100%; margin:0; accent-color:var(--color-teal)}
.audiorate{display:flex; align-items:center; gap:6px; flex:0 0 auto}
.audiorate input[type=range]{width:74px; accent-color:var(--color-teal)}
.chunkpos{font-family:var(--font-mono)}
.playsleft{font-family:var(--font-mono); font-size:12px; color:var(--color-teal)}

/* ---------- toast / modal ---------- */
#toasts{position:fixed; right:18px; bottom:18px; z-index:200; display:flex; flex-direction:column; gap:8px}
.toast{
  background:var(--color-ink); color:var(--color-on-ink); padding:10px 14px;
  border-radius:10px; font-size:13.5px; max-width:360px; box-shadow:0 6px 24px rgba(0,0,0,.22);
}
.toast.err{background:var(--color-danger); color:#fff}
.toast.ok{background:var(--color-good); color:#fff}

.modalwrap{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:150;
  display:flex; align-items:center; justify-content:center; padding:20px}
.modal{background:var(--color-surface); border:1px solid var(--color-rule); border-radius:var(--radius-lg);
  width:min(680px,100%); max-height:86vh; overflow:auto; padding:20px}
.modal.lg{width:min(920px,100%)}
[hidden]{display:none!important}

/* ---------- ai log ---------- */
.ailog{
  font-family:var(--font-mono); font-size:11.5px; background:var(--color-card-back);
  border:1px solid var(--color-rule); border-radius:var(--radius); padding:12px;
  max-height:260px; overflow:auto; white-space:pre-wrap; line-height:1.6;
}
.ailog .ok{color:var(--color-good)} .ailog .er{color:var(--color-danger)} .ailog .dim{color:var(--color-muted)}

.spin{display:inline-block; width:12px; height:12px; border:2px solid var(--color-rule);
  border-top-color:var(--color-accent); border-radius:99px; animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- charts ---------- */
.sparkrow{display:flex; align-items:flex-end; gap:3px; height:44px}
.sparkrow i{flex:1; background:var(--color-accent-soft); border-radius:3px 3px 0 0; min-height:3px; display:block}
.sparkrow i.pass{background:var(--color-good)}

/* ---------- responsive ---------- */
@media (max-width:1080px){ .runner{grid-template-columns:1fr} .side{position:static} }

@media (max-width:900px){
  /* sidebar becomes an overlay drawer on every small screen */
  .shell, .shell.nav-hidden{grid-template-columns:1fr}
  .sidebar{
    position:fixed; inset:0 auto 0 0; width:min(84vw,280px); z-index:120;
    transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.28);
    padding:16px 14px; border-right:1px solid var(--color-rule);
  }
  .sidebar.open{transform:none}
  .shell.nav-hidden .sidebar{width:min(84vw,280px); padding:16px 14px}

/* ---------- gap-fill chips (replaces plain <select> for cloze gaps) ----------
   The chip is a plain <button>; the choice list is a separate element
   appended to <body> and positioned with fixed coordinates computed in JS.
   That means opening it never resizes or reflows the chip/passage itself,
   and it always draws above everything else (no z-index/overflow issues
   from parent cards clipping it). */
.gapchip{
  display:inline-block; margin:0 3px; vertical-align:baseline;
  cursor:pointer; border:1.5px dashed var(--color-accent); border-radius:7px;
  background:var(--color-accent-softer); color:var(--color-accent);
  font:inherit; font-family:var(--font-mono); font-size:13px; line-height:1.5;
  padding:2px 10px; min-width:20px;
}
.gapchip:hover{background:var(--color-accent-soft)}
.gapchip.filled{
  border-style:solid; background:var(--color-teal-soft); border-color:var(--color-teal);
  color:var(--color-ink); font-family:var(--font-sans); font-size:14px; white-space:normal;
}
.gapchip.open{outline:2px solid var(--color-accent); outline-offset:1px}
.gapchip.filled.correct{background:var(--color-teal-soft); border-color:var(--color-good)}
.gapchip.filled.wrong{background:var(--color-rose-soft); border-color:var(--color-danger)}
.gapchip-list{
  position:fixed; z-index:9999; min-width:250px; max-width:min(440px,92vw);
  background:var(--color-surface); border:1px solid var(--color-rule); border-radius:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.28); padding:6px; display:flex; flex-direction:column; gap:5px;
  max-height:min(320px,70vh); overflow-y:auto;
}
.gapchip-opt{
  display:flex; gap:9px; align-items:flex-start; text-align:left; padding:8px 10px; border-radius:7px;
  border:1px solid var(--color-rule-soft); background:var(--color-bg-2); cursor:pointer; font-size:13px;
  color:var(--color-ink); width:100%; font-family:var(--font-sans);
}
.gapchip-opt:hover{background:var(--color-accent-softer); border-color:var(--color-accent)}
.gapchip-opt.sel{background:var(--color-teal-soft); border-color:var(--color-teal)}
.gapchip-opt .k{font-family:var(--font-mono); color:var(--color-muted); flex:none; min-width:14px; padding-top:1px}
.gapchip-opt .tx{flex:1; white-space:normal; word-break:break-word; line-height:1.4}
.gapchip-opt.gapchip-clear{background:var(--color-rose-soft); border-color:var(--color-rose)}
.gapchip-opt.gapchip-clear .k,.gapchip-opt.gapchip-clear .tx{color:var(--color-rose)}

/* ---------- KI-Fehleranalyse: farbliche Textmarkierungen ---------- */
.mkleg{display:flex; flex-wrap:wrap; gap:8px 14px; margin:8px 0 14px; font-size:12px; color:var(--color-muted)}
.mkleg span{display:inline-flex; align-items:center; gap:5px}
.mkleg i{width:12px; height:12px; border-radius:3px; display:inline-block; font-style:normal}
.mktext{line-height:1.9; font-size:15px; white-space:pre-wrap}
.mk{cursor:pointer; border-radius:4px; padding:0 1px; transition:filter .1s}
.mk:hover{filter:brightness(1.08)}
.mk-wrong{background:var(--color-rose-soft); color:var(--color-rose); text-decoration:underline wavy var(--color-rose); text-decoration-thickness:1.5px; text-underline-offset:3px}
.mk-extra{background:var(--color-rose-soft); color:var(--color-rose); text-decoration:line-through; text-decoration-thickness:1.5px}
.mk-extra::before{content:"✕"; font-size:10px; margin-right:2px; opacity:.85}
.mk-missing{background:var(--color-teal-soft); color:var(--color-good); font-weight:600; border-radius:4px; padding:0 3px}
.mk-missing::before{content:"+"; margin-right:2px; opacity:.8}
.mk-punct{background:var(--color-amber-soft); color:var(--color-amber); text-decoration:underline dotted var(--color-amber); text-decoration-thickness:1.5px; text-underline-offset:3px}
.mk-tone{background:var(--color-indigo-soft); color:var(--color-indigo); border-bottom:2px solid var(--color-indigo)}
.mk-style{background:var(--color-plum-soft); color:var(--color-plum); border-bottom:2px dashed var(--color-plum)}
.mk-note{
  margin-top:14px; padding:10px 12px; border-radius:9px; background:var(--color-bg-2);
  border:1px solid var(--color-rule-soft); font-size:13px;
}

/* ============================================================================
   PRÜFUNGSSTUDIO
   A single-file mock-exam studio for Goethe-Zertifikat, telc and TestDaF.
   No backend, no accounts. Everything lives in localStorage and in JSON files
   you import/export yourself.
   ========================================================================== */

/* ----------------------------- small helpers ----------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    /* <textarea>/<select> have no working "value" HTML attribute — the browser
       ignores setAttribute("value", …) for them, so any pre-filled textarea
       (Schreiben answer, Sprechen transcript, Notizen) silently rendered empty
       on every re-render even though the answer was safely saved. Set the DOM
       property instead for these two tags; every other tag keeps using the
       attribute exactly as before. */
    else if (k === "value" && (tag === "textarea" || tag === "select")) n.value = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};

/* =========================================================================

function examDef(examId = S.settings.exam) { return BLUEPRINTS[examId]; }

function levelsFor(examId = S.settings.exam) { return examDef(examId).levels; }
/** " " + level, but empty when the exam only has one level (nothing to distinguish, e.g. TestDaF). */
function examLevelText(examId, level) { return levelsFor(examId).length > 1 ? " " + level : ""; }

/** Returns a deep copy of the blueprint for exam+level with any user edits merged in. */
function blueprint(examId = S.settings.exam, level = S.settings.level) {
  const ex = examDef(examId);
  if (!ex) return null;
  let lv = ex.L[level];
  if (!lv) { level = ex.levels[0]; lv = ex.L[level]; }
  const bp = clone(lv);
  const ov = (S.pattern[examId] || {})[level];
  if (ov) {
    for (const [mk, mv] of Object.entries(ov.modules || {})) {
      if (!bp.modules[mk]) continue;
      if (mv.minutes != null) bp.modules[mk].minutes = mv.minutes;
      for (const [pid, pv] of Object.entries(mv.parts || {})) {
        const part = bp.modules[mk].parts.find(p => p.id === pid);
        if (part) Object.assign(part, pv);
      }
    }
  }
  bp._exam = examId; bp._level = level;
  return bp;
}

function setOverride(examId, level, mod, partId, field, value) {
  S.pattern[examId] = S.pattern[examId] || {};
  S.pattern[examId][level] = S.pattern[examId][level] || { modules: {} };
  const L = S.pattern[examId][level];
  L.modules[mod] = L.modules[mod] || { parts: {} };
  if (partId === "_module") L.modules[mod][field] = value;
  else {
    L.modules[mod].parts = L.modules[mod].parts || {};
    L.modules[mod].parts[partId] = L.modules[mod].parts[partId] || {};
    L.modules[mod].parts[partId][field] = value;
  }
  savePattern();
}
function clearOverrides(examId, level) {
  if (S.pattern[examId]) delete S.pattern[examId][level];
  savePattern();
}

const moduleKeys = bp => Object.keys(bp.modules);
const partMax  = p => (p.items || 1) * (p.ptsPerItem || 0);
const moduleMax = m => m.parts.reduce((s, p) => s + partMax(p), 0);
const moduleItems = m => m.parts.reduce((s, p) => s + (p.items || 0), 0);
const moduleMinutes = m => m.minutes != null ? m.minutes : m.parts.reduce((s, p) => s + (p.minutes || 0), 0);
const totalMinutes = bp => moduleKeys(bp).reduce((s, k) => s + moduleMinutes(bp.modules[k]), 0);

/* =========================================================================
   SCORING
   ======================================================================= */
/** Score one module attempt. Returns {raw, max, pct, normalised, label, passed, perPart} */
function scoreModule(bp, modKey, content, answers) {
  const mod = bp.modules[modKey];
  const perPart = [];
  let raw = 0, max = 0, pendingHuman = 0;

  for (const part of mod.parts) {
    const pc = content && content[part.id];
    const fmt = FORMATS[part.format] || {};
    const pm = partMax(part);
    max += pm;
    let got = 0, correct = 0, answered = 0, autoable = fmt.auto && pc && pc.items;

    if (autoable) {
      pc.items.forEach((it, i) => {
        const key = part.id + ":" + i;
        const given = answers ? answers[key] : undefined;
        if (given !== undefined && given !== null && given !== "") answered++;
        if (given !== undefined && String(given) === String(it.answer)) { correct++; got += part.ptsPerItem; }
      });
    } else {
      // Human/AI-graded: use stored grade if present (0..1 of part max)
      const g = answers ? answers[part.id + ":grade"] : null;
      if (g != null) got = pm * clamp(Number(g), 0, 1);
      else { pendingHuman += pm; }
      answered = (answers && answers[part.id + ":0"]) ? 1 : 0;
    }
    raw += got;
    perPart.push({ id: part.id, label: part.label, max: pm, got, correct, answered,
                   items: part.items, auto: !!autoable, format: part.format });
  }

  const pct = max ? raw / max : 0;
  const sc = bp.scoring || { kind: "module100", pass: 60 };
  let normalised = Math.round(pct * 100), label = normalised + " / 100", passed = normalised >= 60, scale = 100;

  if (sc.kind === "module100") {
    normalised = Math.round(pct * 100); scale = 100;
    passed = normalised >= (sc.pass || 60);
    label = normalised + " / 100";
  } else if (sc.kind === "telc300") {
    normalised = Math.round(raw * 10) / 10; scale = max;
    passed = pct >= 0.6;
    label = normalised + " / " + Math.round(max) + " Pkt";
  } else if (sc.kind === "split") {
    normalised = Math.round(raw * 10) / 10; scale = max;
    passed = pct >= 0.6;
    label = normalised + " / " + Math.round(max) + " Pkt";
  } else if (sc.kind === "tdn") {
    const c = sc.cut;
    let tdn = "unter TDN 3";
    if (pct >= c["TDN 5"]) tdn = "TDN 5";
    else if (pct >= c["TDN 4"]) tdn = "TDN 4";
    else if (pct >= c["TDN 3"]) tdn = "TDN 3";
    normalised = Math.round(pct * 100); scale = 100;
    const order = ["unter TDN 3", "TDN 3", "TDN 4", "TDN 5"];
    passed = order.indexOf(tdn) >= order.indexOf(sc.target);
    label = tdn + " · " + Math.round(raw) + "/" + Math.round(max) + " Items";
  }
  return { raw: Math.round(raw * 10) / 10, max: Math.round(max * 10) / 10, pct, normalised, scale,
           label, passed, perPart, pendingHuman: Math.round(pendingHuman * 10) / 10 };
}

/** Roll module results up into an exam verdict. */
function examVerdict(bp, results) {
  const sc = bp.scoring || {};
  const keys = Object.keys(results);
  if (!keys.length) return null;
  if (sc.kind === "module100" || sc.kind === "tdn") {
    const all = keys.every(k => results[k].passed);
    return { text: all ? "Alle vorliegenden Module bestanden" : "Mindestens ein Modul unter der Grenze", ok: all };
  }
  // aggregate exams: written block vs speaking
  let wr = 0, wm = 0, sp = 0, sm = 0;
  for (const k of keys) {
    const r = results[k];
    if (k === "sprechen") { sp += r.raw; sm += r.max; } else { wr += r.raw; wm += r.max; }
  }
  const wOk = wm ? wr / wm >= 0.6 : true, sOk = sm ? sp / sm >= 0.6 : true;
  return {
    text: (wOk && sOk) ? "Schriftlich und mündlich über 60 %" : "Unter 60 % in " + (!wOk ? "schriftlich" : "mündlich"),
    ok: wOk && sOk,
    detail: "Schriftlich " + Math.round(wr) + "/" + Math.round(wm) + " · Mündlich " + Math.round(sp) + "/" + Math.round(sm)
  };
}

/* =========================================================================
   TEST LIBRARY
   ======================================================================= */
function currentTests() {
  return S.tests.filter(x => x.exam === S.settings.exam && x.level === S.settings.level);
}
function currentTest() {
  const list = currentTests();
  if (!list.length) return null;
  const found = list.find(x => x.id === S.settings.testId);
  if (found) return found;
  S.settings.testId = list[0].id; saveSettings();
  return list[0];
}
function testById(id) { return S.tests.find(x => x.id === id); }

/** Build an empty content skeleton matching a blueprint. */
function emptyContent(bp) {
  const c = {};
  for (const mk of moduleKeys(bp)) {
    c[mk] = {};
    for (const p of bp.modules[mk].parts) c[mk][p.id] = null;
  }
  return c;
}
function newTest(exam, level, name, source = "manual") {
  const bp = blueprint(exam, level);
  return { id: uid("test"), name: name || (examDef(exam).short + " " + level + " — Modelltest"),
           exam, level, createdAt: Date.now(), source, content: emptyContent(bp) };
}
function contentCoverage(test) {
  if (!test) return { filled: 0, total: 0 };
  const bp = blueprint(test.exam, test.level);
  let filled = 0, total = 0;
  for (const mk of moduleKeys(bp)) for (const p of bp.modules[mk].parts) {
    total++;
    const c = test.content?.[mk]?.[p.id];
    if (c && (c.items?.length || c.prompt || c.task)) filled++;
  }
  return { filled, total };
}
function moduleCoverage(test, mk) {
  if (!test) return { filled: 0, total: 0 };
  const bp = blueprint(test.exam, test.level);
  const mod = bp.modules[mk]; if (!mod) return { filled: 0, total: 0 };
  let filled = 0;
  for (const p of mod.parts) {
    const c = test.content?.[mk]?.[p.id];
    if (c && (c.items?.length || c.prompt || c.task)) filled++;
  }
  return { filled, total: mod.parts.length };
}

const answerKey = (testId, mk) => testId + "::" + mk;
function getAnswers(testId, mk) { return S.answers[answerKey(testId, mk)] || {}; }
function setAnswers(testId, mk, obj) { S.answers[answerKey(testId, mk)] = obj; saveAnswers(); }
function clearAnswers(testId, mk) { delete S.answers[answerKey(testId, mk)]; saveAnswers(); }

/* ---- save checkpoints: remembers WHEN and WHERE (part + remaining time)
   a module was left, on top of the answers themselves, so "Fortsetzen"
   really resumes at the same spot instead of just restoring the ticked
   boxes. Works the same for every module of every exam/test. ---- */
function getCheckpoint(testId, mk) { return S.progress[answerKey(testId, mk)] || null; }
function setCheckpoint(testId, mk, partIndex, secondsLeft) {
  S.progress[answerKey(testId, mk)] = { savedAt: Date.now(), partIndex: partIndex || 0, secondsLeft: secondsLeft || 0 };
  saveProgress();
}
function clearCheckpoint(testId, mk) { delete S.progress[answerKey(testId, mk)]; saveProgress(); }
function fmtSavedAt(ts) {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  return sameDay ? ("heute " + time + " Uhr") : (d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + ", " + time + " Uhr");
}
/* every module+test with saved, unfinished progress, across every exam/level,
   newest first — the "resume from anywhere" list for the dashboard. */
function allCheckpoints() {
  return Object.keys(S.progress).map(k => {
    const idx = k.lastIndexOf("::");
    const testId = k.slice(0, idx), moduleKey = k.slice(idx + 2);
    const test = testById(testId);
    if (!test) return null;
    const cp = S.progress[k];
    return { testId, moduleKey, test, savedAt: cp.savedAt, partIndex: cp.partIndex, secondsLeft: cp.secondsLeft };
  }).filter(Boolean).sort((a, b) => b.savedAt - a.savedAt);
}

let toastN = 0;
function toast(msg, kind = "", ms = 3800) {
  const n = el("div", { class: "toast " + kind, text: msg });
  $("#toasts").append(n);
  const id = ++toastN;
  setTimeout(() => { n.style.opacity = "0"; n.style.transition = "opacity .3s"; setTimeout(() => n.remove(), 320); }, ms);
  return id;
}
function modal(node, big) {
  const box = $("#modalBox");
  box.className = "modal" + (big ? " lg" : "");
  box.innerHTML = "";
  box.append(node);
  $("#modalWrap").hidden = false;
}
function closeModal() { $("#modalWrap").hidden = true; $("#modalBox").innerHTML = ""; }
$("#modalWrap")?.addEventListener("click", e => { if (e.target.id === "modalWrap") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modalWrap").hidden) closeModal(); });

function confirmBox(title, body, onYes, yesLabel = "Ja, fortfahren", danger = true) {
  modal(el("div", {},
    el("h2", { text: title }),
    el("p", { class: "muted small", style: "margin:8px 0 18px", text: body }),
    el("div", { class: "row", style: "justify-content:flex-end" },
      el("button", { class: "btn", onclick: closeModal, text: "Abbrechen" }),
      el("button", { class: "btn " + (danger ? "danger" : "primary"), text: yesLabel,
        onclick: () => { closeModal(); onYes(); } })
    )
  ));
}

function download(filename, data, mime = "application/json") {
  const blob = new Blob([typeof data === "string" ? data : JSON.stringify(data, null, 2)], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

const VIEWS = {};
function go(view, params) {
  if (typeof closeGapPopover === "function") closeGapPopover();
  S.view = view;
  $$(".navitem").forEach(b => b.setAttribute("aria-current", String(b.dataset.view === view)));
  $("#sidebar").classList.remove("open");
  const scrim = $("#navScrim"); if (scrim) scrim.hidden = true;
  const app = $("#app");
  app.innerHTML = "";
  const fn = VIEWS[view] || VIEWS.dashboard;
  app.append(fn(params || {}));
  window.scrollTo(0, 0);
}
function refresh() { go(S.view); }

const SEED_TESTS = [SEED_GOETHE_B2, SEED_TELC_B1, SEED_TESTDAF];

/** Makes sure S.tests is an array (first run ever). Does NOT add any "(Standard)"
 *  example tests — those are only added when the user explicitly clicks
 *  "Standard-Modelltests wiederherstellen". The library (modeltest/ folders)
 *  is the only thing that appears automatically. */
function ensureTestsArray() {
  if (!Array.isArray(S.tests)) { S.tests = []; saveTests(); }
}
function installSeeds() {
  if (!Array.isArray(S.tests)) S.tests = [];
  for (const seed of SEED_TESTS) {
    if (!S.tests.some(x => x.id === seed.id)) S.tests.push(Object.assign(clone(seed), { createdAt: Date.now() }));
  }
  saveTests();
}
function restoreSeed(id) {
  const seed = SEED_TESTS.find(s => s.id === id);
  if (!seed) return false;
  const i = S.tests.findIndex(x => x.id === id);
  const fresh = Object.assign(clone(seed), { createdAt: Date.now() });
  if (i >= 0) S.tests[i] = fresh; else S.tests.push(fresh);
  saveTests();
  return true;
}

}

function lastAttempt(testId, mk) {
  const list = S.attempts.filter(a => a.testId === testId && a.module === mk);
  return list.length ? list[list.length - 1] : null;
}
function bestAttempt(exam, level, mk) {
  const list = S.attempts.filter(a => a.exam === exam && a.level === level && a.module === mk);
  if (!list.length) return null;
  return list.reduce((b, a) => (a.normalised > b.normalised ? a : b), list[0]);

<script>
"use strict";
/* =========================================================================
   SPEECH — the Hören modules are voiced by the browser, so a model test
   works offline with no audio files to ship. Every play, pause, resume,
   seek and restart rebuilds fresh utterances from the target chunk onward;
   this is slightly wasteful but sidesteps the cross-browser flakiness of
   re-speaking or native-pausing SpeechSynthesisUtterance objects.
   ======================================================================= */
const Speech = {
  activeKey: null, playing: false,
  voices() {
    const v = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    return v.filter(x => /^de/i.test(x.lang));
  },
  pick() {
    const vs = this.voices();
    if (!vs.length) return null;
    const want = S.settings.speechVoice;
    return vs.find(v => v.name === want) || vs[0];
  },
  /** One SpeechSynthesisUtterance per sentence-ish chunk. Never speaks them.
   *  Falls back to plain objects if the browser has no speech synthesis at
   *  all, so chunk counting (and therefore the progress ring) still works. */
  build(lines, rate) {
    const hasTTS = typeof SpeechSynthesisUtterance !== "undefined";
    const voice = this.pick();
    const utts = [];
    (lines || []).forEach(ln => {
      const txt = (ln.speaker ? ln.speaker + ". " : "") + ln.text;
      const chunks = txt.match(/[^.!?]+[.!?]*\s*/g) || [txt];
      let buf = "";
      const pushBuf = () => {
        if (!buf.trim()) { buf = ""; return; }
        const u = hasTTS ? new SpeechSynthesisUtterance(buf) : { text: buf };
        u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = rate || 1;
        utts.push(u); buf = "";
      };
      for (const c of chunks) { if ((buf + c).length > 220) pushBuf(); buf += c; }
      pushBuf();
    });
    return utts;
  },
  /** Chunk count for a script, without touching the audio system. */
  chunkCount(lines) { return this.build(lines, 1).length; },
  /** Plays a script from chunk `fromIdx` onward. `key` scopes the callbacks so a
   *  stopped or superseded player can never keep talking over a new one. Returns
   *  the total chunk count synchronously. */
  playFrom(key, lines, rate, fromIdx, onProgress, onEnd) {
    this.stop();
    if (!window.speechSynthesis) { toast("Dieser Browser kann keine Sprachausgabe. Nutzen Sie das Transkript.", "err"); onEnd && onEnd(0); return 0; }
    const utts = this.build(lines, rate);
    const total = utts.length;
    fromIdx = clamp(fromIdx || 0, 0, Math.max(0, total - 1));
    this.activeKey = key; this.playing = true;
    const seq = utts.slice(fromIdx);
    const step = i => {
      if (this.activeKey !== key) return;
      if (i >= seq.length) { this.playing = false; this.activeKey = null; onEnd && onEnd(total); return; }
      const globalIdx = fromIdx + i;
      onProgress && onProgress(globalIdx, total);
      const u = seq[i];
      u.onend = () => { if (this.activeKey === key) step(i + 1); };
      u.onerror = () => { if (this.activeKey === key) step(i + 1); };
      speechSynthesis.speak(u);
    };
    step(0);
    return total;
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) {} this.playing = false; this.activeKey = null; }
};
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

/** Stops audio and marks any in-flight player as paused (not "playing") so
 *  its controls read correctly the next time its part is shown. */
function stopAudio() {
  Speech.stop();
  const R = S.run;
  if (!R || !R.audio) return;
  for (const k of Object.keys(R.audio)) if (R.audio[k].status === "playing") R.audio[k].status = "paused";
}

/* =========================================================================
   RUN SESSION
   ======================================================================= */
function startRun(testId, moduleKey, opts = {}) {
  const test = testById(testId);
  if (!test) return toast("Modelltest nicht gefunden.", "err");
  const bp = blueprint(test.exam, test.level);
  const mod = bp.modules[moduleKey];
  if (!mod) return toast("Dieses Modul gibt es in diesem Aufbau nicht.", "err");

  const cov = moduleCoverage(test, moduleKey);
  if (!cov.filled) {
    return confirmBox("Noch keine Inhalte", "Für " + modName(moduleKey) + " sind noch keine Aufgaben hinterlegt. Jetzt mit der KI generieren?",
      () => aiGenerateModule(testId, moduleKey), "Generieren", false);
  }

  const cp = getCheckpoint(testId, moduleKey);
  const resuming = !!cp && !opts.fresh;

  S.run = {
    testId, test, bp, moduleKey, mod,
    partIndex: resuming ? Math.min(cp.partIndex || 0, mod.parts.length - 1) : 0,
    answers: Object.assign({}, getAnswers(testId, moduleKey)),
    plays: {},
    startedAt: Date.now(),
    secondsLeft: resuming && cp.secondsLeft > 0 ? cp.secondsLeft : moduleMinutes(mod) * 60,
    finished: false,
    chain: opts.chain || null,     // remaining modules for a full exam run
    reviewing: false
  };
  go("run");
  startClock();
  if (resuming) toast("Fortgesetzt — gespeichert " + fmtSavedAt(cp.savedAt) + ".", "ok");
}

function startFullExam(testId) {
  const test = testById(testId);
  const bp = blueprint(test.exam, test.level);
  const keys = moduleKeys(bp).filter(k => moduleCoverage(test, k).filled > 0);
  if (!keys.length) return toast("Es sind noch keine Inhalte vorhanden.", "err");
  confirmBox("Komplette Prüfung starten?",
    "Die Module laufen nacheinander mit ihren eigenen Zeitgebern: " + keys.map(k => modName(k) + " " + moduleMinutes(bp.modules[k]) + " Min").join(", ") + ". Gesamt " + keys.reduce((s, k) => s + moduleMinutes(bp.modules[k]), 0) + " Minuten.",
    () => startRun(testId, keys[0], { chain: keys.slice(1) }), "Prüfung starten", false);
}

let clockTimer = null;
function startClock() {
  stopClock();
  let tick = 0;
  clockTimer = setInterval(() => {
    if (!S.run || S.run.finished) return stopClock();
    S.run.secondsLeft--;
    const c = $("#clock");
    if (c) {
      c.textContent = fmtClock(S.run.secondsLeft);
      c.className = "clock" + (S.run.secondsLeft < 60 ? " crit" : S.run.secondsLeft < 300 ? " warn" : "");
    }
    if (++tick % 20 === 0) saveRunAnswers(); // quiet safety-net checkpoint every 20s, on top of the explicit Save button
    if (S.run.secondsLeft <= 0) {
      stopClock();
      if (S.settings.strictTimer) { toast("Zeit abgelaufen — das Modul wurde abgegeben.", "err"); finishRun(); }
      else toast("Zeit abgelaufen. Sie üben ohne Zeitdruck weiter.", "");
    }
  }, 1000);
}
function stopClock() { if (clockTimer) clearInterval(clockTimer); clockTimer = null; }

/* Extra safety net: if the tab is closed, refreshed or backgrounded without
   using "Speichern & Verlassen" (e.g. urgent interruption), still persist
   the checkpoint so nothing is lost. */
window.addEventListener("beforeunload", () => { if (S.run && !S.run.finished) saveRunAnswers(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && S.run && !S.run.finished) saveRunAnswers(); });

function saveRunAnswers() {
  if (!S.run) return;
  setAnswers(S.run.testId, S.run.moduleKey, S.run.answers);
  setCheckpoint(S.run.testId, S.run.moduleKey, S.run.partIndex, S.run.secondsLeft);
}

/* Explicit "Speichern & Verlassen": always visible during any run, for any
   module of any exam. Writes the checkpoint (current part + remaining time,
   not just the answers) with a fresh timestamp, confirms with the exact
   time, and returns to the dashboard. */
function saveAndLeaveRun() {
  if (!S.run) return;
  stopAudio(); stopClock();
  saveRunAnswers();
  const savedAt = Date.now();
  const chainWas = S.run.chain;
  S.run = null;
  go("dashboard");
  toast("Fortschritt gespeichert — " + fmtSavedAt(savedAt) + ". Sie können jederzeit genau hier weitermachen.", "ok", 5000);
  if (chainWas && chainWas.length) toast("Der restliche Prüfungsdurchlauf bleibt ebenfalls gespeichert.", "", 5000);
}

/* =========================================================================
   RUN VIEW
   ======================================================================= */
VIEWS.run = () => {
  hideSelPop();
  const R = S.run;
  const shell = el("div", {});
  if (!R) { shell.append(el("div", { class: "page" }, el("div", { class: "empty" }, "Keine aktive Sitzung."))); return shell; }
  if (R.reviewing) return reviewView();

  const part = R.mod.parts[R.partIndex];
  const content = R.test.content?.[R.moduleKey]?.[part.id];

  /* --- top bar --- */
  const nav = el("div", { class: "partnav" }, R.mod.parts.map((p, i) => {
    const done = partAnswered(p);
    return el("button", { "aria-current": String(i === R.partIndex), class: done ? "done" : "", title: p.label + " — " + p.task,
      onclick: () => { stopAudio(); R.partIndex = i; go("run"); } }, String(i + 1));
  }));

  const ratioSeg = el("div", { class: "seg ratioseg", title: "Aufteilung Text / Aufgaben" },
    ["30-70", "50-50", "70-30", "100"].map(r =>
      el("button", { "data-ratio": r, "aria-pressed": String(splitRatio() === r),
        title: r === "100" ? "Eine Spalte" : "Text " + r.split("-")[0] + " % · Aufgaben " + r.split("-")[1] + " %",
        onclick: () => { S.settings.splitRatio = r; saveSettings(); go("run"); } },
        r === "100" ? "1 Spalte" : r)));

  shell.append(el("div", { class: "runbar" },
    el("button", { class: "btn sm ghost", title: "Sichert Antworten, aktuellen Teil und verbleibende Zeit — später an genau dieser Stelle weitermachen.", onclick: () => exitRun() }, "💾 Speichern & Verlassen"),
    el("div", { class: "row", style: "gap:8px" },
      el("span", { class: "pill " + MODULE_META[R.moduleKey].cls }, el("span", { class: "mod-dot" }), modName(R.moduleKey)),
      el("span", { class: "xsmall muted", text: R.test.name })),
    el("div", { class: "spacer" }),
    ratioSeg,
    nav,
    el("div", { id: "clock", class: "clock", text: fmtClock(R.secondsLeft) }),
    el("button", { class: "btn sm accent", onclick: () => confirmFinish() }, "Abgeben")
  ));

  const page = el("div", { class: "page wide" });
  const grid = el("div", { class: "runner" });

  /* --- main column --- */
  const col = el("div", { class: "col" });
  col.append(el("div", { class: "row", style: "justify-content:space-between;align-items:flex-end" },
    el("div", {},
      el("div", { class: "small muted" }, part.label + " · " + part.task),
      el("h2", { text: content?.title || part.task })),
    el("span", { class: "pill" }, (part.items || 1) + " " + t("word.items") + " · " + Math.round(partMax(part)) + " " + t("word.points"))));

  col.append(el("p", { class: "small muted", style: "max-width:72ch", text: content?.instruction || part.instruction || "" }));

  /* --- two panes: material on the left, tasks on the right --- */
  const leftLabel = el("div", { class: "pane-label", text: "Text · Material" });
  const rightLabel = el("div", { class: "pane-label", text: "Aufgaben" });
  const left = el("div", { class: "pane" }, leftLabel);
  const right = el("div", { class: "pane" }, rightLabel);
  const split = el("div", { class: "split", "data-ratio": splitRatio() }, left, right);

  if (!content) {
    right.append(el("div", { class: "empty" },
      el("p", { text: t("msg.noquestions") }),
      el("button", { class: "btn accent", style: "margin-top:10px", onclick: () => aiGeneratePart(R.testId, R.moduleKey, part.id) }, "✦ Diesen Teil generieren")));
  } else {
    renderPart(left, right, part, content);
  }

  /* nothing on the left? collapse to a single column for this part */
  if (left.children.length <= 1) {
    left.remove();
    split.setAttribute("data-ratio", "100");
    rightLabel.remove();
  }
  col.append(split);

  /* --- navigation buttons --- */
  col.append(el("div", { class: "row", style: "margin-top:20px;justify-content:space-between" },
    el("button", { class: "btn", disabled: R.partIndex === 0, onclick: () => { stopAudio(); R.partIndex--; go("run"); } }, "← Vorheriger Teil"),
    el("div", { class: "row" },
      el("button", { class: "btn sm ghost", onclick: () => aiGeneratePart(R.testId, R.moduleKey, part.id) }, "✦ Neu generieren"),
      R.partIndex < R.mod.parts.length - 1
        ? el("button", { class: "btn primary", onclick: () => { stopAudio(); R.partIndex++; go("run"); } }, "Nächster Teil →")
        : el("button", { class: "btn accent", onclick: confirmFinish }, t("btn.finish")))
  ));

  /* --- side column --- */
  const side = el("div", { class: "side" });
  side.append(el("div", { class: "card tight" },
    el("h4", { text: "Fortschritt" }),
    el("div", { class: "bar", style: "margin:8px 0" }, el("i", { style: "width:" + Math.round(answeredCount() / Math.max(1, totalItems()) * 100) + "%" })),
    el("div", { class: "xsmall muted" }, answeredCount() + " von " + totalItems() + " Aufgaben beantwortet"),
    el("div", { class: "sep" }),
    el("div", { class: "xsmall muted" }, "Empfohlene Zeit für " + part.label + ": " + (part.minutes || "—") + " Min"),
    S.settings.strictTimer ? el("div", { class: "xsmall muted", style: "margin-top:4px" }, "Strenger Zeitgeber: bei 00:00 wird automatisch abgegeben.")
      : el("div", { class: "xsmall muted", style: "margin-top:4px" }, "Übungsmodus: Die Uhr läuft weiter, aber nichts wird erzwungen.")
  ));

  const notesKey = part.id + ":notes";
  side.append(el("div", { class: "card tight" },
    el("h4", { text: "Notizen" }),
    el("textarea", { rows: 6, placeholder: "Stichworte, Gliederung, Zahlen …", style: "margin-top:8px",
      value: R.answers[notesKey] || "",
      oninput: e => { R.answers[notesKey] = e.target.value; saveRunAnswers(); } })));

  side.append(buildAnnotationPanel(part));

  side.append(el("div", { class: "card tight" },
    el("h4", { text: "Tipp" }),
    el("p", { class: "xsmall muted", style: "margin-top:6px" },
      R.moduleKey === "hoeren" && content?.audio
        ? "Markieren Sie Text im Material links, um ihn hervorzuheben oder zu kommentieren — geht auch im Transkript. Tempo und Stimme der Sprachausgabe lassen sich hier am Player und in den Einstellungen anpassen."
        : "Markieren Sie Text im Material links mit der Maus, um ihn hervorzuheben oder eine Notiz dazu zu speichern.")));

  grid.append(col, side);
  page.append(grid);
  shell.append(page);
  return shell;
};

function exitRun() { saveAndLeaveRun(); }

function totalItems() {
  const R = S.run;
  return R.mod.parts.reduce((s, p) => s + (FORMATS[p.format]?.essay || FORMATS[p.format]?.spoken ? 1 : (p.items || 0)), 0);
}
function answeredCount() {
  const R = S.run;
  let n = 0;
  for (const p of R.mod.parts) {
    const max = FORMATS[p.format]?.essay || FORMATS[p.format]?.spoken ? 1 : (p.items || 0);
    for (let i = 0; i < max; i++) { const v = R.answers[p.id + ":" + i]; if (v !== undefined && v !== null && String(v).trim() !== "") n++; }
  }
  return n;
}
function partAnswered(p) {
  const R = S.run;
  const max = FORMATS[p.format]?.essay || FORMATS[p.format]?.spoken ? 1 : (p.items || 0);
  if (!max) return false;
  for (let i = 0; i < max; i++) { const v = R.answers[p.id + ":" + i]; if (v === undefined || v === null || String(v).trim() === "") return false; }
  return true;
}

/* =========================================================================
   PART RENDERING
   ======================================================================= */
function splitRatio() {
  const r = S.settings.splitRatio;
  return ["30-70", "50-50", "70-30", "100"].includes(r) ? r : "50-50";
}

/** A small circular progress ring. Returns {node, set(fraction)}. */
function ringWidget(size) {
  size = size || 46;
  const r = 19, circ = 2 * Math.PI * r;
  const node = el("div", { class: "ring", style: "width:" + size + "px;height:" + size + "px",
    html: '<svg viewBox="0 0 46 46" width="' + size + '" height="' + size + '">' +
      '<circle cx="23" cy="23" r="' + r + '" fill="none" stroke="var(--color-rule)" stroke-width="4"/>' +
      '<circle class="ringfg" cx="23" cy="23" r="' + r + '" fill="none" stroke="var(--color-teal)" stroke-width="4" stroke-linecap="round" ' +
      'stroke-dasharray="' + circ + '" stroke-dashoffset="' + circ + '" transform="rotate(-90 23 23)"/></svg>' });
  const fg = node.querySelector(".ringfg");
  return { node, set(frac) { if (fg) fg.setAttribute("stroke-dashoffset", String(circ * (1 - clamp(frac, 0, 1)))); } };
}

/** The Hören control strip: progress ring, play/pause/continue/restart, step
 *  back/forward, a scrub bar, remaining-plays counter and a per-player speed
 *  slider. State lives in S.run.audio[part.id] so it survives navigating to
 *  another part and back — pausing and resuming never spends another play;
 *  only starting from a blank or fully-played position does. */
function buildAudioPlayer(part, c) {
  const R = S.run;
  R.audio = R.audio || {};
  R.rate = R.rate || {};
  R.plays[part.id] = R.plays[part.id] || 0;

  const ai = R.audio[part.id] || (R.audio[part.id] = { idx: 0, status: "idle", total: Speech.chunkCount(c.audio.script) });
  const allowed = c.audio.plays || part.plays || 1;
  const usedLeft = () => Math.max(0, allowed - R.plays[part.id]);
  const rate = () => R.rate[part.id] || S.settings.speechRate;

  const ring = ringWidget(46);
  const posLbl = el("span", { class: "chunkpos xsmall muted" });
  const playsLbl = el("span", { class: "playsleft" });
  const mainBtn = el("button", { class: "btn sm accent" });
  const backBtn = el("button", { class: "btn sm ghost seek", type: "button", title: "Einen Abschnitt zurück" }, "⏮");
  const fwdBtn  = el("button", { class: "btn sm ghost seek", type: "button", title: "Einen Abschnitt vor" }, "⏭");
  const scrub = el("input", { type: "range", class: "scrub", min: "0", max: "0", value: "0" });
  const rateSlider = el("input", { type: "range", min: "0.6", max: "1.3", step: "0.05", value: String(rate()) });
  const rateLbl = el("span", { class: "xsmall mono", text: rate().toFixed(2) + "×" });

  function paint() {
    ring.set(ai.total ? ai.idx / ai.total : 0);
    const shown = ai.status === "idle" ? 0 : Math.min(ai.idx + 1, ai.total);
    posLbl.textContent = "Abschnitt " + shown + " / " + ai.total;
    playsLbl.textContent = usedLeft() + " von " + allowed + " Wiedergaben übrig";
    scrub.max = String(Math.max(0, ai.total - 1));
    scrub.value = String(ai.idx);
    scrub.disabled = ai.status === "idle";
    backBtn.disabled = ai.status === "idle" || ai.idx <= 0;
    fwdBtn.disabled = ai.status === "idle" || ai.idx >= ai.total - 1;
    mainBtn.className = "btn sm " + (ai.status === "playing" ? "ghost" : "accent");
    mainBtn.textContent =
      ai.status === "playing" ? "⏸ Pause" :
      ai.status === "paused"  ? "▶ Weiter" :
      ai.status === "ended"   ? "↺ Erneut abspielen" : "▶ Abspielen";
  }

  function onProgress(i, total) { ai.idx = i; ai.total = total; paint(); }
  function onEnd(total) { ai.status = "ended"; ai.idx = total; ai.total = total; paint(); }
  function playFromCurrent() {
    ai.status = "playing"; paint();
    ai.total = Speech.playFrom(part.id, c.audio.script, rate(), ai.idx, onProgress, onEnd);
    paint();
  }

  mainBtn.addEventListener("click", () => {
    if (ai.status === "playing") { stopAudio(); ai.status = "paused"; paint(); return; }
    const fresh = ai.status === "idle" || ai.status === "ended";
    if (fresh) {
      if (usedLeft() <= 0) return toast("Keine Wiedergabe mehr übrig — genau wie in der Prüfung.", "err");
      R.plays[part.id]++;
      ai.idx = 0;
    }
    playFromCurrent();
  });
  backBtn.addEventListener("click", () => {
    const wasPlaying = ai.status === "playing";
    stopAudio(); ai.idx = Math.max(0, ai.idx - 1);
    if (wasPlaying) playFromCurrent(); else { ai.status = "paused"; paint(); }
  });
  fwdBtn.addEventListener("click", () => {
    const wasPlaying = ai.status === "playing";
    stopAudio(); ai.idx = Math.min(Math.max(0, ai.total - 1), ai.idx + 1);
    if (wasPlaying) playFromCurrent(); else { ai.status = "paused"; paint(); }
  });
  scrub.addEventListener("input", () => {
    if (ai.status === "idle") return;
    const wasPlaying = ai.status === "playing";
    stopAudio(); ai.idx = Number(scrub.value);
    if (wasPlaying) playFromCurrent(); else { ai.status = "paused"; paint(); }
  });
  rateSlider.addEventListener("input", () => {
    R.rate[part.id] = Number(rateSlider.value);
    rateLbl.textContent = R.rate[part.id].toFixed(2) + "×";
  });
  rateSlider.addEventListener("change", () => { if (ai.status === "playing") playFromCurrent(); });

  paint();
  return el("div", { class: "audioctl" },
    ring.node,
    el("div", { class: "audiomain" },
      el("div", { class: "row" }, backBtn, mainBtn, fwdBtn),
      scrub,
      el("div", { class: "row", style: "justify-content:space-between" }, playsLbl, posLbl)),
    el("div", { class: "audiorate" },
      el("span", { class: "xsmall muted", text: "Tempo" }), rateSlider, rateLbl)
  );
}

function renderPart(col, right, part, c) {
  const fmt = FORMATS[part.format] || {};
  const R = S.run;

  /* ---- listening player ---- */
  if (c.audio && c.audio.script) {
    const transcript = el("div", { class: "stimulus", hidden: true, style: "margin-top:10px" },
      c.audio.script.map(l => el("p", {}, el("b", { text: l.speaker ? l.speaker + ": " : "" }), l.text)));
    const tBtn = el("button", { class: "btn sm ghost", onclick: () => {
      transcript.hidden = !transcript.hidden;
      tBtn.textContent = transcript.hidden ? "Transkript anzeigen" : "Transkript verbergen";
    } }, "Transkript anzeigen");

    col.append(buildAudioPlayer(part, c), el("div", { class: "row" }, tBtn), transcript);
  }

  /* ---- reading stimulus ---- */
  if (c.personas) {
    const box = el("div", { class: "stimulus" }, el("h4", { text: c.title || "" }));
    c.personas.forEach((p, i) => box.append(el("div", { class: "persona" },
      el("b", {}, LETTERS[i] + ") " + (p.name || "")), el("p", { text: p.text }))));
    col.append(box);
  }
  if (c.texts) {
    const box = el("div", { class: "stimulus" }, c.texts.map(x =>
      el("div", { style: "margin-bottom:12px" }, el("b", { text: "Text " + x.n + " " }), el("span", { text: x.text }))));
    col.append(box);
  }
  if (c.passage && !fmt.cloze) {
    col.append(el("div", { class: "stimulus" }, c.passage.split(/\n\n+/).map(p => el("p", { text: p }))));
  }
  if (c.chart) col.append(el("div", { class: "stimulus", style: "font-family:var(--font-mono);font-size:13px" }, c.chart));

  /* ---- by format ---- */
  if (fmt.cloze && c.passage) return renderCloze(col, right, part, c);
  if (fmt.essay)  return renderWriting(col, right, part, c);
  if (fmt.spoken) return renderSpeaking(col, right, part, c);
  if (fmt.text)   return renderShort(right, part, c);
  if (fmt.bank)   return renderBank(col, right, part, c);
  return renderChoice(right, part, c);
}

/* Instant feedback (Einstellungen → „Sofort-Feedback“): the chosen answer turns
   green when it is right and red when it is wrong. Off = exactly as before. */
function fbClass(it, val) {
  if (!S.settings.instantFeedback || !it) return "";
  if (val === undefined || val === null || val === "") return "";
  if (it.answer === undefined || it.answer === null || it.answer === "") return "";
  return String(val) === String(it.answer) ? "correct" : "wrong";
}

/* ---- multiple choice / true-false / yes-no ---- */
function renderChoice(col, part, c) {
  const R = S.run;
  const fixed = part.fixedOpts || FORMATS[part.format]?.fixed;
  (c.items || []).forEach((it, i) => {
    const key = part.id + ":" + i;
    const opts = it.options || fixed || FORMATS[part.format]?.fixed || ["a", "b", "c"];
    const box = el("div", { class: "q" },
      el("div", { class: "qhead" }, el("span", { class: "qnum", text: String(i + 1) }), el("div", { text: it.prompt })));
    const list = el("div", { class: opts.length <= 3 && opts.every(o => String(o).length < 14) ? "optrow" : "opts" });
    opts.forEach((o, oi) => {
      const sel = String(R.answers[key]) === String(oi);
      const lab = el("label", { class: "opt" + (sel ? " sel" : "") },
        el("input", { type: "radio", name: key, checked: sel, onchange: () => {
          R.answers[key] = oi; saveRunAnswers();
          paint();
          if (S.settings.autoAdvance) {} // reserved
        } }),
        el("span", { class: "k", text: LETTERS[oi] }), el("span", { text: String(o) }));
      list.append(lab);
    });
    function paint() {
      const cur = R.answers[key];
      Array.from(list.children).forEach((ch, ci) => {
        const on = cur !== undefined && String(cur) === String(ci);
        ch.classList.toggle("sel", on);
        ch.classList.remove("correct", "wrong");
        if (on) { const f = fbClass(it, cur); if (f) ch.classList.add(f); }
      });
    }
    paint();
    box.append(list);
    col.append(box);
  });
}

/* ---- matching against a bank ---- */
function renderBank(col, right, part, c) {
  const R = S.run;
  const bank = c.bank || [];
  const allowX = part.bankHasX || (c.items || []).some(i => i.answer === "x");

  if (bank.length && !c.personas) {
    col.append(el("div", { class: "card tight" },
      el("h4", { text: "Auswahl" }),
      el("div", { class: "col", style: "gap:6px;margin-top:8px" },
        bank.map(b => el("div", { class: "small" }, el("b", { class: "mono", text: b.key + "  " }), b.text)))));
  }
  col = right;

  /* Persona matching answers with the persona index, bank matching with the
     letter key — the stored value has to match the answer key exactly. */
  const choices = c.personas
    ? c.personas.map((p, i) => ({ val: i, label: LETTERS[i], title: p.name || "" }))
    : bank.map(b => ({ val: b.key, label: b.key, title: b.text || "" }));
  if (allowX) choices.push({ val: "x", label: "x", title: "keine passende Lösung" });

  (c.items || []).forEach((it, i) => {
    const key = part.id + ":" + i;
    const box = el("div", { class: "q" },
      el("div", { class: "qhead" }, el("span", { class: "qnum", text: String(i + 1) }), el("div", { text: it.prompt })));
    const row = el("div", { class: "optrow" });
    choices.forEach(ch => {
      const sel = String(R.answers[key]) === String(ch.val);
      const b = el("button", { class: "opt" + (sel ? " sel" : ""), type: "button", title: ch.title,
        onclick: () => { R.answers[key] = ch.val; saveRunAnswers(); paint(); } }, el("span", { class: "k", text: ch.label }));
      b.dataset.k = String(ch.val);
      row.append(b);
    });
    function paint() {
      const cur = R.answers[key];
      Array.from(row.children).forEach(n => {
        const on = cur !== undefined && n.dataset.k === String(cur);
        n.classList.toggle("sel", on);
        n.classList.remove("correct", "wrong");
        if (on) { const f = fbClass(it, cur); if (f) n.classList.add(f); }
      });
    }
    paint();
    box.append(row);
    col.append(box);
  });
}

/* ---- cloze: gapmc (own options) and gapbank (shared bank) ---- */

/* Popover manager: a single choice list is appended straight to <body> and
   positioned with fixed coordinates, so it always draws above every card
   (no z-index/overflow-clipping issues) and never changes the layout of the
   chip that opened it (no shift on open/close — only the chip's own text
   changes width once an answer is actually picked, which is expected). */
let _gapPopover = null, _gapPopoverBtn = null;
function closeGapPopover() {
  if (_gapPopoverBtn) _gapPopoverBtn.classList.remove("open");
  if (_gapPopover) _gapPopover.remove();
  _gapPopover = null; _gapPopoverBtn = null;
  document.removeEventListener("click", onGapPopoverOutside, true);
  window.removeEventListener("scroll", onGapPopoverScroll, true);
  window.removeEventListener("resize", closeGapPopover);
}
function onGapPopoverOutside(e) {
  if (_gapPopover && !_gapPopover.contains(e.target) && e.target !== _gapPopoverBtn) closeGapPopover();
}
/* "scroll" events don't bubble, but a capturing listener on window still
   fires for a scroll that happened *inside* the popover's own scrollable
   list (capture runs window → … → target before the event "arrives").
   That closed the box the instant you tried to scroll it. Only close on a
   scroll that happened outside the popover. */
function onGapPopoverScroll(e) {
  if (_gapPopover && (e.target === _gapPopover || _gapPopover.contains(e.target))) return;
  closeGapPopover();
}
function openGapPopover(btn, options, cur, onPick) {
  if (_gapPopoverBtn === btn) { closeGapPopover(); return; } // click again = close
  closeGapPopover();
  const direct = !!S.settings.directGapFill;
  const pop = el("div", { class: "gapchip-list" });
  if (cur !== undefined && cur !== null && cur !== "") {
    pop.append(el("button", { type: "button", class: "gapchip-opt gapchip-clear",
      onclick: e => { e.stopPropagation(); onPick(undefined); closeGapPopover(); } },
      el("span", { class: "k", text: "✕" }), el("span", { class: "tx", text: "Auswahl entfernen" })));
  }
  options.forEach(o => {
    const isSel = String(cur) === String(o.val);
    const row = el("button", { type: "button", class: "gapchip-opt" + (isSel ? " sel" : ""),
      onclick: e => { e.stopPropagation(); onPick(isSel ? undefined : o.val); closeGapPopover(); } },
      el("span", { class: "k", text: o.label + ")" }));
    if (direct) row.append(el("span", { class: "tx", text: o.text }));
    pop.append(row);
  });
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect();
  const popW = pop.offsetWidth, popH = pop.offsetHeight;
  let left = Math.min(Math.max(8, r.left), window.innerWidth - popW - 8);
  let top = r.bottom + 6;
  if (top + popH > window.innerHeight - 8 && r.top - popH - 6 > 8) top = r.top - popH - 6;
  pop.style.left = left + "px";
  pop.style.top = top + "px";
  btn.classList.add("open");
  _gapPopover = pop; _gapPopoverBtn = btn;
  setTimeout(() => {
    document.addEventListener("click", onGapPopoverOutside, true);
    window.addEventListener("scroll", onGapPopoverScroll, true);
    window.addEventListener("resize", closeGapPopover);
  }, 0);
}

/* A gap-fill chip: shows just the gap number until answered. With "Direkte
   Lückenauswahl" AUS (Standard, wie in der echten Prüfung) both the chip and
   the choice list show ONLY the letter/key — exactly like the real exam,
   where the full word/sentence lives solely in the side list. With it AN,
   both the chip and the choice list show the full text, and picking one
   inserts that full text — never truncated with "…", however long the
   Goethe-style sentence is. Picking the already-selected option again (or
   "Auswahl entfernen") clears the gap, so nothing stays answered by
   accident when you meant to skip it. */
function buildGapChip(key, gapNo, options, R, it) {
  let cur = R.answers[key];
  const btn = el("button", { type: "button", class: "gapchip" });

  const paint = () => {
    const chosen = options.find(o => String(o.val) === String(cur));
    if (!chosen) {
      btn.textContent = "(" + gapNo + ")";
      btn.classList.remove("filled", "correct", "wrong");
      btn.removeAttribute("title");
    } else {
      const direct = !!S.settings.directGapFill;
      btn.textContent = direct ? chosen.text : chosen.label;
      btn.title = direct ? (chosen.label + " — " + chosen.text) : ("Lücke " + gapNo + ": " + chosen.label);
      btn.classList.add("filled");
      btn.classList.remove("correct", "wrong");
      const f = fbClass(it, cur); if (f) btn.classList.add(f);
    }
  };

  btn.addEventListener("click", () => {
    openGapPopover(btn, options, cur, val => {
      cur = val;
      R.answers[key] = val;
      saveRunAnswers();
      paint();
    });
  });

  paint();
  return btn;
}

function renderCloze(col, right, part, c) {
  const R = S.run;
  const isBank = part.format === "gapbank";

  const optionsFor = idx => {
    const it = (c.items || [])[idx];
    if (isBank) return (c.bank || []).map(b => ({ val: b.key, label: b.key, text: b.text }));
    return (it && it.options || []).map((o, oi) => ({ val: oi, label: LETTERS[oi], text: o }));
  };

  const box = el("div", { class: "stimulus" });
  const paras = c.passage.split(/\n\n+/);
  paras.forEach(para => {
    const p = el("p");
    const parts = para.split(/(___\d+___)/g);
    parts.forEach(seg => {
      const m = seg.match(/^___(\d+)___$/);
      if (!m) { p.append(document.createTextNode(seg)); return; }
      const gapNo = Number(m[1]);
      if (gapNo === 0) {
        const ans = c.example ? (c.example.answer || "—") : "—";
        p.append(el("span", { class: "gapmark", title: "Beispiel", text: "0 = " + ans }));
        return;
      }
      const idx = gapNo - 1;
      const it = (c.items || [])[idx];
      const key = part.id + ":" + idx;
      if (!it) { p.append(el("span", { class: "gapmark", text: String(gapNo) })); return; }
      p.append(buildGapChip(key, gapNo, optionsFor(idx), R, it));
    });
    box.append(p);
  });
  col.append(box);

  /* Reference list (bank text, or the options per gap for gapmc) — placed
     at the bottom of the main column, underneath the passage, rather than
     in the side panel. */
  if (isBank && c.bank) {
    col.append(el("div", { class: "card tight", style: "margin-top:14px" },
      el("h4", { text: "Wortliste / Satzliste" }),
      el("div", { class: "col", style: "gap:5px;margin-top:8px" },
        c.bank.map(b => el("div", { class: "small" }, el("b", { class: "mono", text: b.key + "  " }), b.text)))));
  } else if (!isBank) {
    const listCard = el("div", { class: "card tight", style: "margin-top:14px" }, el("h4", { text: "Optionen je Lücke" }));
    const tb = el("tbody");
    (c.items || []).forEach((it, i) => {
      tb.append(el("tr", {}, el("td", { style: "width:46px" }, el("span", { class: "qnum", text: String(i + 1) })),
        el("td", {}, (it.options || []).map((o, oi) => el("span", { class: "pill", style: "margin-right:6px" }, LETTERS[oi] + ") " + o)))));
    });
    listCard.append(el("table", { class: "tbl" }, tb));
    col.append(listCard);
  }

  /* any items without a gap marker in the passage itself */
  const gapCount = (c.passage.match(/___(\d+)___/g) || []).filter(x => x !== "___0___").length;
  if ((c.items || []).length > gapCount) {
    const extra = el("div", { class: "col", style: "gap:8px;margin-top:12px" });
    (c.items || []).slice(gapCount).forEach((it, k) => {
      const i = gapCount + k, key = part.id + ":" + i;
      const box2 = el("div", { class: "q" }, el("div", { class: "qhead" }, el("span", { class: "qnum", text: String(i + 1) }), el("div", { text: it.prompt })));
      box2.append(buildGapChip(key, i + 1, optionsFor(i), R, it));
      extra.append(box2);
    });
    col.append(extra);
  }
}

function renderWriting(col, right, part, c) {
  const R = S.run, key = part.id + ":0";
  const target = c.words || part.words || 100;

  col.append(el("div", { class: "card tight" },
    el("h4", { text: c.title || part.task }),
    el("p", { style: "margin-top:8px", text: c.prompt || "" }),
    c.bullets ? el("ul", { style: "margin:8px 0 0 18px;padding:0" }, c.bullets.map(b => el("li", { class: "small", text: b }))) : null,
    c.tips ? el("div", { class: "xsmall muted", style: "margin-top:10px", text: "So gehen Sie vor: " + c.tips }) : null));

  const counter = el("span", { class: "wordcount", text: "0 Wörter" });

  function upd() {

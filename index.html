<script>
"use strict";
/* =========================================================================
   IMPORT / EXPORT
   File shapes this app reads and writes:
     { kind:"prepstudio.test",   test:{…} }             one complete model test
     { kind:"prepstudio.module", exam, level, module, name, content:{…} }
     { kind:"prepstudio.bundle", tests:[{…}] }          several tests at once
     { kind:"prepstudio.backup", tests, attempts, pattern, settings }
   ======================================================================= */
const FILE_VERSION = 1;

function wrapTest(test) {
  return { kind: "prepstudio.test", version: FILE_VERSION, exported: new Date().toISOString(), test: clone(test) };
}
function wrapModule(test, mk) {
  return {
    kind: "prepstudio.module", version: FILE_VERSION, exported: new Date().toISOString(),
    exam: test.exam, level: test.level, module: mk,
    name: test.name + " — " + modName(mk),
    content: clone(test.content?.[mk] || {})
  };
}
function safeName(s) { return String(s).replace(/[^\w\-]+/g, "_").replace(/_+/g, "_").slice(0, 60); }

function exportModule(test, mk) {
  download(mk + ".json", wrapModule(test, mk));
  toast(modName(mk) + " exportiert als " + mk + ".json", "ok");
}

function exportTestDialog(test) {
  const bp = blueprint(test.exam, test.level);
  const checks = {};
  const list = el("div", { class: "col", style: "gap:6px;margin:10px 0 0" });
  for (const mk of moduleKeys(bp)) {
    const cb = el("input", { type: "checkbox", checked: true });
    checks[mk] = cb;
    const cov = moduleCoverage(test, mk);
    list.append(el("label", { class: "row", style: "gap:9px;cursor:pointer" }, cb,
      moduleChip(mk), el("span", { class: "xsmall muted", text: cov.filled + "/" + cov.total + " Teile" })));
  }
  modal(el("div", {},
    el("h2", { text: "Exportieren" }),
    el("p", { class: "muted small", style: "margin:6px 0 0", text: "„" + test.name + "“ — als eine Datei mit allen Modulen oder modulweise getrennt." }),
    list,
    el("div", { class: "sep" }),
    el("div", { class: "row" },
      el("button", { class: "btn accent", onclick: () => {
        const picked = moduleKeys(bp).filter(k => checks[k].checked);
        const copy = clone(test);
        copy.content = {};
        picked.forEach(k => copy.content[k] = clone(test.content?.[k] || {}));
        download(safeName(test.name) + ".json", wrapTest(copy));
        closeModal(); toast("Modelltest exportiert (" + picked.length + " Module).", "ok");
      } }, "Als eine Datei"),
      el("button", { class: "btn", onclick: () => {
        const picked = moduleKeys(bp).filter(k => checks[k].checked);
        picked.forEach((k, i) => setTimeout(() => exportModule(test, k), i * 350));
        closeModal();
      } }, "Je Modul eine Datei"),
      el("button", { class: "btn ghost", onclick: closeModal }, "Abbrechen"))
  ));
}

/** Accepts any of the four file shapes; returns a short report string. */
function importPayload(data, mode = "merge") {
  if (!data || typeof data !== "object") throw new Error("Datei enthält kein JSON-Objekt.");
  const kind = data.kind || (data.test ? "prepstudio.test" : data.tests ? "prepstudio.bundle" : null);

  const addTest = (tRaw, src = "import") => {
    const tst = clone(tRaw);
    if (!tst.exam || !tst.level) throw new Error("Im Modelltest fehlt exam oder level.");
    if (!BLUEPRINTS[tst.exam]) throw new Error("Unbekannte Prüfung: " + tst.exam);
    tst.content = tst.content || {};
    tst.source = src;
    tst.createdAt = tst.createdAt || Date.now();
    const existing = tst.id ? S.tests.findIndex(x => x.id === tst.id) : -1;
    if (existing >= 0 && mode === "replace") { S.tests[existing] = tst; return "ersetzt: " + tst.name; }
    if (existing >= 0) { tst.id = uid("test"); tst.name = tst.name + " (importiert)"; }
    if (!tst.id) tst.id = uid("test");
    S.tests.push(tst);
    return "neu: " + tst.name;
  };

  const notes = [];
  if (kind === "prepstudio.test") notes.push(addTest(data.test));
  else if (kind === "prepstudio.bundle") (data.tests || []).forEach(t => notes.push(addTest(t)));
  else if (kind === "prepstudio.backup") {
    (data.tests || []).forEach(t => notes.push(addTest(t)));
    if (Array.isArray(data.attempts)) { S.attempts = S.attempts.concat(data.attempts); saveAttempts(); notes.push(data.attempts.length + " Ergebnisse"); }
    if (data.pattern) { S.pattern = Object.assign(S.pattern, data.pattern); savePattern(); notes.push("Aufbau-Anpassungen"); }
  } else if (kind === "prepstudio.module") {
    if (!data.module || !data.content) throw new Error("Moduldatei ohne module/content.");
    let target = S.tests.find(x => x.exam === data.exam && x.level === data.level && x.id === S.settings.testId)
              || S.tests.find(x => x.exam === data.exam && x.level === data.level);
    if (!target) {
      target = newTest(data.exam, data.level, data.name || "Import " + data.exam + " " + data.level, "import");
      S.tests.push(target);
      notes.push("neuer Modelltest angelegt");
    }
    target.content = target.content || {};
    target.content[data.module] = clone(data.content);
    notes.push(modName(data.module) + " eingefügt in „" + target.name + "“");
  } else if (data.exam && data.level && data.content) {
    notes.push(addTest(data));
  } else {
    throw new Error("Unbekanntes Dateiformat. Erwartet wird eine Datei, die dieses Programm erzeugt hat.");
  }
  saveTests();
  return notes.join(" · ");
}

function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  let done = 0, errs = [];
  files.forEach(f => {
    const fr = new FileReader();
    fr.onload = () => {
      try { const note = importPayload(JSON.parse(fr.result)); done++; toast("Importiert — " + note, "ok", 6000); }
      catch (e) { errs.push(f.name + ": " + e.message); toast(f.name + " — " + e.message, "err", 9000); }
      if (done + errs.length === files.length) refresh();
    };
    fr.onerror = () => { errs.push(f.name); };
    fr.readAsText(f);
  });
}

/* =========================================================================
   MODEL-TEST LIBRARY — works on any host (Vercel, GitHub Pages, own server,
   local folder). Books are plain files next to this HTML file:

     modeltest/<exam>/<Niveau-Ordner>/<Buchname>/{lesen,hoeren,schreiben,sprechen,bausteine}.json

   Nothing to maintain: just upload folders + module files. The app needs one
   flat list of those paths and finds it live, trying in order:
     1. api/library     (Vercel function, ships with the project)
     2. library.php     (any PHP webspace, ships with the project)
     3. directory listing (python -m http.server, Apache/nginx autoindex)
     4. GitHub API      (public repo; auto-detected on *.github.io)
     5. local folder    (Chrome/Edge: choose the project folder ONCE, it is remembered)
   ======================================================================= */
const LIBRARY_MODULES = ["lesen", "hoeren", "schreiben", "sprechen", "bausteine"];
const LIB_BASE = "modeltest/";
const isLibModule = f => /\.json$/i.test(f) && !/(^|\/)library\.json$/i.test(f);
const norm = t => String(t).toLowerCase().replace(/[^a-z0-9]/g, "");
/** Which module is this file? The "module" field inside the file wins, else the file name (any spelling). */
function moduleOf(name, payload) {
  const m = payload && payload.module && String(payload.module).toLowerCase();
  if (m && LIBRARY_MODULES.includes(m)) return m;
  const n = name.toLowerCase().replace(/ö/g, "oe").replace(/ä/g, "ae").replace(/ü/g, "ue");
  for (const [k, v] of [["lesen","lesen"],["read","lesen"],["hoer","hoeren"],["listen","hoeren"],["schreib","schreiben"],["writ","schreiben"],["sprech","sprechen"],["speak","sprechen"],["baustein","bausteine"]])
    if (n.includes(k)) return v;
  return null;
}

function levelSlug(level) { return String(level).replace(/\s+/g, ""); }
function levelFromSlug(exam, slug) {
  const ex = BLUEPRINTS[exam];
  return (ex && ex.levels.find(l => levelSlug(l) === slug)) || slug;
}

function siteRepoGuess() {
  try {
    const m = /^([^.]+)\.github\.io$/i.exec(location.hostname);
    if (!m) return null;
    const owner = m[1];
    const segs = location.pathname.split("/").filter(Boolean);
    const repo = segs.length && !/\.html?$/i.test(segs[0]) ? segs[0] : (owner + ".github.io");
    return { owner, repo };
  } catch (e) { return null; }
}
function repoConfig() {
  const manual = (S.settings.githubRepo || "").trim();
  if (manual.includes("/")) {
    const [owner, repo] = manual.split("/").map(s => s.trim());
    if (owner && repo) return { owner, repo };
  }
  return siteRepoGuess() || libAutoRepo;
}
let libAutoRepo = null;

const encPath = p => p.split("/").map(encodeURIComponent).join("/");
async function fetchJson(url, ms, cacheMode) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms || 12000);
  try {
    const r = await fetch(url, { cache: cacheMode || "no-cache", signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } catch (e) {
    if (e.name === "AbortError") throw new Error("Zeitüberschreitung");
    throw e;
  } finally { clearTimeout(to); }
}

async function srcFromApi(url, label) {
  let m;
  /* unique query string: no service worker, CDN or browser cache can hand back an old list */
  const bust = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
  try { m = await fetchJson(bust, 10000, "no-store"); } catch (e) { throw new Error(/^HTTP/.test(e.message) ? e.message : "keine gültige Antwort"); }
  if (!m || !Array.isArray(m.files)) throw new Error("keine Liste");
  if (m.repo && m.repo.owner) libAutoRepo = m.repo;
  return { kind: "api", label, files: m.files };
}
async function srcFromGitHub() {
  const cfg = repoConfig();
  if (!cfg) throw new Error("kein Repo");
  const branches = S.settings.githubBranch ? [S.settings.githubBranch] : [cfg.branch, "main", "master"].filter(Boolean);
  for (const b of branches) {
    try {
      const j = await fetchJson("https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/git/trees/" + encodeURIComponent(b) + "?recursive=1", 12000, "no-cache");
      if (j.truncated) throw new Error("Liste zu groß");
      const files = (j.tree || []).filter(t => t.type === "blob" && t.path.startsWith(LIB_BASE)).map(t => t.path.slice(LIB_BASE.length));
      if (!S.settings.githubBranch) { S.settings.githubBranch = b; saveSettings(); }
      return { kind: "github", label: "GitHub " + cfg.owner + "/" + cfg.repo, files,
        raw: "https://raw.githubusercontent.com/" + cfg.owner + "/" + cfg.repo + "/" + b + "/" + LIB_BASE };
    } catch (e) { /* next branch */ }
  }
  throw new Error("GitHub nicht erreichbar");
}
async function srcFromDirListing() {
  const files = [];
  async function walk(prefix, depth) {
    const r = await fetch(LIB_BASE + encPath(prefix), { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const html = await r.text();
    if (depth === 0 && !/Index of|Directory listing|Verzeichnis/i.test(html)) throw new Error("kein Verzeichnis-Listing");
    const doc = new DOMParser().parseFromString(html, "text/html");
    const hrefs = [...doc.querySelectorAll("a[href]")].map(a => a.getAttribute("href"))
      .filter(h => h && !/^([a-z][a-z0-9+.-]*:|#|\?|\/|\.\.)/i.test(h));
    await Promise.all(hrefs.map(async h => {
      const name = decodeURIComponent(h);
      if (name.endsWith("/")) { if (depth < 6) await walk(prefix + name, depth + 1); }
      else files.push(prefix + name);
    }));
  }
  await walk("", 0);
  return { kind: "listing", label: "Ordnerliste des Servers", files };
}
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("ps-lib", 1); r.onupgradeneeded = () => r.result.createObjectStore("h"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("h").objectStore("h").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("h", "readwrite"); t.objectStore("h").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbDel(k) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("h", "readwrite"); t.objectStore("h").delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }

let libHandle = null;   // remembered local folder (project folder or modeltest folder)
async function srcFromHandle(root, interactive) {
  if ((await root.queryPermission({ mode: "read" })) !== "granted") {
    if (!interactive) { const e = new Error("Ordnerzugriff muss erlaubt werden."); e.code = "NEEDS_PERMISSION"; throw e; }
    if ((await root.requestPermission({ mode: "read" })) !== "granted") throw new Error("Zugriff verweigert.");
  }
  let dir = root;
  if (root.name !== "modeltest") {
    try { dir = await root.getDirectoryHandle("modeltest"); }
    catch (e) { throw new Error("Im gewählten Ordner gibt es keinen Unterordner „modeltest“ — bitte den Projektordner wählen."); }
  }
  const files = [], handles = new Map();
  async function walk(d, prefix) {
    for await (const [name, h] of d.entries()) {
      if (h.kind === "directory") await walk(h, prefix + name + "/");
      else { files.push(prefix + name); handles.set(prefix + name, h); }
    }
  }
  await walk(dir, "");
  return { kind: "picker", label: "lokaler Ordner", files, handles };
}
async function srcFromPicker() {
  const h = await window.showDirectoryPicker({ mode: "read" });
  const src = await srcFromHandle(h, true);
  libHandle = h;
  try { await idbSet("root", h); } catch (e) { /* remembered only for this session */ }
  return src;
}
function srcFromInput(list) {
  const files = [], fileObjs = new Map();
  for (const f of list) {
    const parts = (f.webkitRelativePath || f.name).split("/");
    const i = parts.indexOf("modeltest");
    if (i < 0) continue;
    const rel = parts.slice(i + 1).join("/");
    files.push(rel); fileObjs.set(rel, f);
  }
  if (!files.length) throw new Error("Im gewählten Ordner gibt es keinen Unterordner „modeltest“ — bitte den Projektordner wählen.");
  return { kind: "picker", label: "gewählter Ordner", files, fileObjs };
}
async function srcFromStoredHandle() {
  if (!window.showDirectoryPicker) throw new Error("nicht unterstützt");
  if (!libHandle) { try { libHandle = (await idbGet("root")) || null; } catch (e) {} }
  if (!libHandle) throw new Error("kein Ordner gemerkt");
  return srcFromHandle(libHandle, false);
}

/* =========================================================================
   LIBRARY STATE
   The top bar is built from the real folder tree under modeltest/:
     modeltest/<Prüfung>/<Niveau>/<Ordner>/<Unterordner …>/(lesen|hoeren|schreiben|sprechen).json
   One dropdown per folder level, as deep as the folders go, until a folder
   that holds the module .json files — that folder is the model test.
   Delete a folder (e.g. telc) and it disappears from the bar; add one and it
   shows up. Nothing is hard-coded except how to score a known exam.
   ======================================================================= */
let libSrc = null;      // source used to read module files
let libLog = [];
let libTree = null;     // folder tree built from libSrc.files
let libLive = false;    // libSrc came from a live source (not the saved offline copy)
let libLoadP = null;    // in-flight load, shared by every caller (no parallel storms)
let libLastTry = 0;
let libError = null;
let libBusy = false;
let libIntent = false;  // the person just picked something in the bar
const libSynced = new Set();     // leaf keys re-read from the source this session
const libBusyLeaf = new Set();   // leaf keys being read right now
const libStatus = new Map();     // leaf key -> { text, err, warn }
let libPathNow = [];
let libRefreshQueued = false;
const LIB_CACHE_KEY = "ps.libFiles.v1";
const libCmp = (a, b) => a.localeCompare(b, "de", { numeric: true, sensitivity: "base" });

/* last known file list — lets the bar appear instantly and keeps it alive when
   the network or GitHub's rate limit fails */
function libCacheStore(s) {
  if (!s || !["api", "listing", "github"].includes(s.kind)) return;
  try { localStorage.setItem(LIB_CACHE_KEY, JSON.stringify({ kind: s.kind, label: s.label, raw: s.raw || null, files: s.files, at: Date.now() })); } catch (e) {}
}
function libCacheLoad() {
  try {
    const c = JSON.parse(localStorage.getItem(LIB_CACHE_KEY) || "null");
    if (!c || !Array.isArray(c.files) || !c.files.some(isLibModule)) return null;
    return { kind: c.kind, label: "zuletzt bekannte Liste", raw: c.raw || undefined, files: c.files };
  } catch (e) { return null; }
}

async function libSource() {
  if (libSrc && (libLive || Date.now() - libLastTry < 30000)) return libSrc;
  if (libLoadP) return libLoadP;
  libLastTry = Date.now();
  libLoadP = (async () => {
    const log = [];
    const attempts = [
      ["api/library", () => srcFromApi("api/library", "Server (api/library)")],
      ["library.php", () => srcFromApi("library.php", "Server (library.php)")],
      ["library-index.json", () => srcFromApi("library-index.json", "Server (library-index.json)")],
      ["Ordnerliste des Servers", srcFromDirListing],
      ["GitHub", srcFromGitHub],
      ["gemerkter Ordner", srcFromStoredHandle],
    ];
    let needsPermission = false;
    for (const [name, attempt] of attempts) {
      try {
        const s = await attempt();
        if (s.files.some(isLibModule)) { libSrc = s; libLive = true; libLog = log; libCacheStore(s); return s; }
        log.push(name + ": erreichbar, aber keine .json-Dateien in modeltest/ gefunden");
      } catch (e) {
        if (e.code === "NEEDS_PERMISSION") needsPermission = true;
        log.push(name + ": " + e.message);
      }
    }
    libLog = log;
    const c = libCacheLoad();                 // offline / rate-limited: last known list
    if (c) { libSrc = c; libLive = false; return c; }
    const err = new Error("Keine Bibliothek gefunden."); err.code = needsPermission ? "NEEDS_PERMISSION" : "NO_SOURCE"; throw err;
  })().finally(() => { libLoadP = null; });
  return libLoadP;
}

/** Folder tree from the flat list of relative file paths. */
function buildLibTree(files) {
  const mk = (name, path) => ({ name, path, children: new Map(), mods: [] });
  const root = mk("", []);
  for (const f of files) {
    if (!isLibModule(f)) continue;
    const parts = f.split("/").filter(Boolean);
    if (parts.length < 2) continue;          // a .json directly inside modeltest/ belongs to no folder
    let n = root;
    for (let i = 0; i < parts.length - 1; i++) {
      let c = n.children.get(parts[i]);
      if (!c) { c = mk(parts[i], parts.slice(0, i + 1)); n.children.set(parts[i], c); }
      n = c;
    }
    n.mods.push({ name: parts[parts.length - 1], path: f });
  }
  return root;
}
function libNodeAt(path) {
  let n = libTree;
  for (const s of path) { n = n && n.children.get(s); }
  return n || null;
}

/* folder name -> blueprint id ("goethe", "Goethe-Zertifikat", "TestDaF" …) */
function examIdForFolder(name) {
  const n = norm(name);
  for (const x of Object.values(BLUEPRINTS)) if ([x.id, x.short, x.name].some(v => v && norm(v) === n)) return x.id;
  for (const x of Object.values(BLUEPRINTS)) if (n.startsWith(norm(x.id))) return x.id;
  return null;
}
function examLabel(folder) {
  const id = examIdForFolder(folder), x = id && BLUEPRINTS[id];
  return x && [x.id, x.short].some(v => v && norm(v) === norm(folder)) ? x.name : folder;
}
/** Which blueprint (exam + level) does a folder path use, and what is the path below the level? */
function libSelection(path) {
  let exam = examIdForFolder(path[0]);
  const known = !!exam;
  if (!exam) exam = "goethe";
  const lvls = levelsFor(exam);
  let level = path[1] ? lvls.find(l => norm(l) === norm(path[1])) : null;
  let from = 2;
  if (!level) { level = lvls.includes("B2") ? "B2" : lvls[0]; from = 1; }
  return { exam, level, known, key: path.join("/"), rel: path.slice(from).join("/") };
}
function libLeaves() {
  const out = [];
  (function walk(n) { if (n.mods.length) out.push({ node: n, sel: libSelection(n.path) }); n.children.forEach(walk); })(libTree);
  return out;
}
function findLibTest(sel) {
  let t = S.tests.find(x => x.source === "library" && x.libraryKey === sel.key);
  if (t) return t;
  t = S.tests.find(x => x.source === "library" && !x.libraryKey && x.exam === sel.exam && x.level === sel.level && x.libraryPath === sel.rel);
  if (t) { t.libraryKey = sel.key; saveTests(); }
  return t || null;
}

/** Removes locally cached library tests whose folder no longer exists (deleted
 *  or renamed). Only ever runs against a LIVE listing, never the offline copy. */
function pruneOrphanedLibraryTests() {
  if (!Array.isArray(S.tests) || !libTree || !libLive) return;
  const leaves = libLeaves();
  if (!leaves.length) return;
  const keys = new Set(leaves.map(l => l.sel.key));
  const legacy = new Set(leaves.map(l => l.sel.exam + "|" + l.sel.level + "|" + l.sel.rel));
  const before = S.tests.length;
  S.tests = S.tests.filter(t => t.source !== "library" ||
    (t.libraryKey ? keys.has(t.libraryKey) : legacy.has(t.exam + "|" + t.level + "|" + t.libraryPath)));
  if (S.tests.length !== before) {
    saveTests();
    if (S.settings.testId && !testById(S.settings.testId)) { S.settings.testId = null; saveSettings(); }
  }
}

async function libReadFile(f) {
  const s = libSrc;
  if (s.data && s.data[f.path] !== undefined) return s.data[f.path];
  if (s.fileObjs) return JSON.parse((await s.fileObjs.get(f.path).text()).replace(/^\uFEFF/, ""));
  if (s.handles) return JSON.parse((await (await s.handles.get(f.path).getFile()).text()).replace(/^\uFEFF/, ""));
  try { return await fetchJson(LIB_BASE + encPath(f.path), 15000, "no-cache"); }
  catch (e) { if (s.raw) return fetchJson(s.raw + encPath(f.path), 15000, "no-cache"); throw e; }
}

/** Reads every module file of a leaf folder and merges them into a model test
 *  (created on first visit, refreshed — including removed modules — on later ones). */
async function importFolderAsTest(sel, modFiles) {
  const { exam, level } = sel;
  const results = await Promise.allSettled(modFiles.map(f => libReadFile(f).then(payload => ({ name: f.name, payload }))));
  const found = [], warns = [];
  let failed = false;
  for (const r of results) {
    if (r.status !== "fulfilled") { failed = true; continue; }
    const { name, payload: p } = r.value;
    if (p && p.kind === "prepstudio.test" && p.test && p.test.content) {
      Object.keys(p.test.content).forEach(k => LIBRARY_MODULES.includes(k) && found.push({ mk: k, content: p.test.content[k] }));
      continue;
    }
    const mk = moduleOf(name, p);
    if (!mk) continue;
    if (p && ((p.level && norm(p.level) !== norm(level)) || (p.exam && norm(p.exam) !== norm(exam)))) warns.push(name + " ist für " + p.exam + " " + p.level);
    found.push({ mk, content: p && p.content ? p.content : p });
  }
  if (!found.length) throw new Error(failed ? "Dateien konnten nicht gelesen werden." : "Keine erkennbaren Moduldateien (lesen / hoeren / schreiben / sprechen) in diesem Ordner.");
  let test = findLibTest(sel), changed = false;
  if (!test) {
    test = newTest(exam, level, sel.key.split("/").pop() || "Modelltest", "library");
    test.libraryKey = sel.key; test.libraryPath = sel.rel;
    S.tests.push(test); changed = true;
  }
  for (const f of found) {
    const next = clone(f.content);
    if (JSON.stringify(test.content[f.mk]) !== JSON.stringify(next)) { test.content[f.mk] = next; changed = true; }
  }
  if (!failed) {          // a module file that was deleted from the folder is removed from the test as well
    const bp = blueprint(test.exam, test.level), empty = emptyContent(bp);
    for (const mk of moduleKeys(bp)) {
      if (found.some(f => f.mk === mk)) continue;
      if (Object.values(test.content[mk] || {}).some(Boolean)) { test.content[mk] = empty[mk]; changed = true; }
    }
  }
  if (changed) saveTests();
  return { test, found: found.length, warn: warns.join("; "), changed };
}

/* ---- the top-bar: one dropdown per folder level ---- */
function resetLibPath() { S.settings.libSel = []; }

function libApplyTest(t) {
  const st = S.settings;
  const ch = st.exam !== t.exam || st.level !== t.level || st.testId !== t.id;
  if (ch) {
    if (st.testId !== t.id) S.run = null;
    st.exam = t.exam; st.level = t.level; st.testId = t.id; saveSettings();
  }
  return ch;
}
function libQueueRefresh() {
  if (libRefreshQueued) return;
  libRefreshQueued = true;
  setTimeout(() => { libRefreshQueued = false; try { refresh(); } catch (e) {} }, 0);
}

/** The folder path the bar shows right now. */
function libResolve() {
  const st = S.settings;
  let want = Array.isArray(st.libSel) ? st.libSel : [];
  const cur = st.testId ? testById(st.testId) : null;
  if (!libIntent && cur && cur.source === "library" && cur.libraryKey) {      // e.g. "Fortsetzen" jumped to another test
    const p = cur.libraryKey.split("/"), n = libNodeAt(p);
    if (n && n.mods.length) want = p;
  }
  /* exam / level changed elsewhere (Einstellungen) beat a stale remembered path */
  if (want.length && !libIntent) {
    const ex = examIdForFolder(want[0]);
    if (ex && ex !== st.exam && !(cur && cur.source === "library")) want = [];
    else if (want[1] && ex && levelsFor(ex).some(l => norm(l) === norm(want[1])) && norm(want[1]) !== norm(st.level) && ex === st.exam && !(cur && cur.source === "library")) want = want.slice(0, 1);
  }
  let node = libTree; const path = [];
  for (const name of want) { const c = node.children.get(name); if (!c) break; node = c; path.push(name); }
  while (!node.mods.length && node.children.size) {
    const names = [...node.children.keys()].sort(libCmp);
    const mem = (st.libMemory || {})[path.join("/")];
    let pick = null;
    if (path.length === 0) pick = names.find(n => examIdForFolder(n) === st.exam) || null;
    if (!pick && mem && node.children.has(mem)) pick = mem;          // back to what was chosen there last time
    if (!pick && path.length === 1) {
      const ex = examIdForFolder(path[0]);
      pick = ex ? names.find(n => norm(n) === norm(st.level) && levelsFor(ex).some(l => norm(l) === norm(n))) || null : null;
    }
    if (!pick) pick = names[0];
    node = node.children.get(pick); path.push(pick);
  }
  return path;
}

function libPick(depth, value) {
  const path = libPathNow.slice(0, depth);
  const st = S.settings;
  st.libMemory = st.libMemory || {};
  if (value) { st.libMemory[path.join("/")] = value; path.push(value); }
  st.libSel = path; saveSettings();
  libIntent = true;
  renderLibRow();
}

/** Makes the leaf's model test the active one (reading it first if it is new). */
function libEnsureActive(leaf, path) {
  const sel = libSelection(path), key = sel.key, st = S.settings;
  if (JSON.stringify(st.libSel) !== JSON.stringify(path)) {
    st.libSel = path.slice();
    st.libMemory = st.libMemory || {};
    path.forEach((seg, i) => { st.libMemory[path.slice(0, i).join("/")] = seg; });   // remember the choice on every level
    saveSettings();
  }
  const cur = testById(st.testId);
  const manualActive = cur && cur.source !== "library" && cur.exam === st.exam && cur.level === st.level;
  const t = findLibTest(sel);
  if (t && (libIntent || !manualActive)) {
    libIntent = false;
    if (libApplyTest(t)) libQueueRefresh();
  }
  if ((!t || (libLive && !libSynced.has(key))) && !libBusyLeaf.has(key)) libSyncLeaf(leaf, sel);
}
function libSyncLeaf(leaf, sel) {
  const key = sel.key;
  libBusyLeaf.add(key);
  if (!findLibTest(sel)) libStatus.set(key, { text: "wird geladen …" });
  importFolderAsTest(sel, leaf.mods).then(res => {
    libSynced.add(key); libBusyLeaf.delete(key);
    libStatus.set(key, { text: "✓ " + res.found + " Modul" + (res.found === 1 ? "" : "e") + (res.warn ? " ⚠" : ""), warn: res.warn });
    if (libPathNow.join("/") === key) {
      const st = S.settings, cur = testById(st.testId);
      const manualActive = cur && cur.source !== "library" && cur.exam === st.exam && cur.level === st.level;
      let ch = false;
      if (libIntent || !manualActive) { libIntent = false; ch = libApplyTest(res.test); }
      if ((ch || res.changed) && !(S.run && !S.run.finished && S.run.testId === res.test.id)) libQueueRefresh();
    }
    renderLibRow();
  }).catch(e => {
    libSynced.add(key); libBusyLeaf.delete(key);            // no endless retry loop; "Bibliothek neu laden" tries again
    libStatus.set(key, { text: "Fehler: " + e.message, err: true });
    renderLibRow();
  });
}

/** Loads (or reloads) the folder list, then redraws the bar. */
async function libReload(force) {
  if (force) { libLive = false; libLastTry = 0; libSynced.clear(); libStatus.clear(); }
  libBusy = true; renderLibRow();
  try {
    const s = await libSource();
    libTree = buildLibTree(s.files); libError = null;
    if (libLive) pruneOrphanedLibraryTests();
  } catch (e) {
    libError = e;
    if (!libSrc) libTree = null;
  }
  libBusy = false;
  renderLibRow();
}
function libUseSource(src) {
  libSrc = src; libLive = true; libError = null; libLastTry = Date.now();
  libTree = buildLibTree(src.files);
  libSynced.clear(); libStatus.clear();
  pruneOrphanedLibraryTests();
  renderLibRow();
}
function libInit() {
  const c = libCacheLoad();                    // instant bar from the last known list, refreshed right after
  if (c) { libSrc = c; libLive = false; libTree = buildLibTree(c.files); }
  libReload(false);
}
function reloadLibrary() { return libReload(true); }

function libPickButton(label, remembered) {
  if (!window.showDirectoryPicker) {
    const inp = document.createElement("input");
    inp.type = "file"; inp.webkitdirectory = true; inp.multiple = true; inp.style.display = "none";
    inp.addEventListener("change", () => {
      try { libUseSource(srcFromInput([...inp.files])); }
      catch (e) { toast(e.message, "err", 8000); }
    });
    return el("button", { class: "btn sm ghost", onclick: () => inp.click() }, label || "Ordner wählen …", inp);
  }
  return el("button", { class: "btn sm ghost", onclick: async () => {
    try {
      libUseSource(remembered && libHandle ? await srcFromHandle(libHandle, true) : await srcFromPicker());
    } catch (e) { if (e.name !== "AbortError") toast(e.message, "err", 8000); }
  } }, label || "Ordner wählen …");
}

/** Synchronous: draws the bar from the folder tree (never blocks on the network,
 *  never flashes "no model test" while loading). */
function renderLibRow() {
  const row = $("#libRow");
  if (!row) return;
  row.innerHTML = "";
  const exSel = $("#examSelect"), lvSel = $("#levelSelect"), tSel = $("#testSelect");
  const classic = show => { if (exSel) exSel.style.display = show ? "" : "none"; if (tSel) tSel.style.display = show ? "" : "none"; if (!show && lvSel) lvSel.style.display = "none"; };

  if (!libTree || !libTree.children.size) {
    if (libBusy || (!libError && !libTree && !libLastTry)) {
      classic(false);
      row.append(el("span", { class: "xsmall muted", style: "white-space:nowrap", text: "Bibliothek wird geladen …" }));
      return;
    }
    classic(true);                              // no library reachable: the classic selectors still work
    if (!libBusy && Date.now() - libLastTry > 30000) { libReload(false); }
    const local = location.protocol === "file:";
    const e = libError || {};
    const msg = e.code === "NEEDS_PERMISSION" ? "Ordnerzugriff erlauben:" : local ? "Projektordner wählen:" : "Keine Modelltests gefunden";
    row.append(el("span", { class: "xsmall muted", title: libLog.join("\n"), style: "white-space:nowrap", text: msg }));
    if (!local && e.code !== "NEEDS_PERMISSION") row.append(el("button", { class: "btn sm ghost", onclick: () => libReload(true) }, "Erneut versuchen"));
    const b = e.code === "NEEDS_PERMISSION" ? libPickButton("Freigeben", true) : libPickButton("Ordner wählen …");
    if (b) row.append(b);
    return;
  }

  classic(false);
  const path = libResolve();
  libPathNow = path;
  const chain = [libTree];
  path.forEach(p => chain.push(chain[chain.length - 1].children.get(p)));

  for (let d = 0; d < chain.length; d++) {
    const node = chain[d];
    if (!node.children.size) break;
    const names = [...node.children.keys()].sort(libCmp);
    const ex = d >= 1 ? examIdForFolder(path[0]) : null;
    const isLevel = d === 1 && ex && levelsFor(ex).some(l => norm(l) === norm(names[0]));
    if (isLevel && names.length === 1 && !node.mods.length) continue;       // a single level (TestDaF): nothing to choose
    const sel = el("select", { title: d === 0 ? "Prüfung" : "Ordner" });
    if (node.mods.length) sel.append(el("option", { value: "", text: "(dieser Ordner)" }));
    names.forEach(n => sel.append(el("option", { value: n, selected: path[d] === n, text: d === 0 ? examLabel(n) : n })));
    if (node.mods.length && path[d] === undefined) sel.value = "";
    const depth = d;
    sel.addEventListener("change", e => libPick(depth, e.target.value));
    row.append(sel);
  }

  const leaf = chain[chain.length - 1];
  if (leaf.mods.length) {
    const sel = libSelection(path);
    const known = libStatus.get(sel.key) || (findLibTest(sel) ? { text: "✓ geladen" } : { text: "wird geladen …" });
    const pill = el("span", { class: "pill xsmall " + (known.err ? "" : "teal"), text: known.text });
    if (known.err) pill.style.color = "var(--color-danger)";
    if (known.warn) pill.title = known.warn;
    else if (!sel.known) pill.title = "Unbekannte Prüfung — es wird der Aufbau von Goethe verwendet.";
    if (!libLive) pill.title = (pill.title ? pill.title + " · " : "") + "Zuletzt bekannte Liste (offline)";
    row.append(pill);
    libEnsureActive(leaf, path);
  }
}

function libraryCard() {
  const repoInput = el("input", { type: "text", value: S.settings.githubRepo || "", placeholder: "Benutzername/Repo (optional)" });
  const n = libSrc ? libSrc.files.filter(isLibModule).length : 0;
  const pick = libPickButton();
  const dbg = el("pre", { class: "xsmall", style: "display:none;white-space:pre-wrap;margin-top:8px" });
  return el("div", { class: "card", style: "margin-bottom:16px" },
    el("h3", { text: "Modellbibliothek" }),
    el("p", { class: "xsmall muted", style: "margin:4px 0 10px;max-width:70ch" },
      "Einfach Ordner und Moduldateien hochladen: modeltest/<Prüfung>/<Niveau>/<Buch>/… (Unterordner beliebig tief). " +
      "Jeder Ordner mit JSON-Dateien ist ein Modelltest und erscheint oben in der Kopfzeile — nichts zu pflegen."),
    el("div", { class: "row" },

    el("label", { class: "field", style: "margin-top:12px" }, "GitHub-Repository (optional — nur nötig, wenn nichts anderes erreichbar ist)", repoInput),
    el("div", { class: "row", style: "margin-top:10px" },
      el("button", { class: "btn sm", onclick: () => {
        S.settings.githubRepo = repoInput.value.trim();
        S.settings.githubBranch = "";
        saveSettings();
        reloadLibrary();
        toast("Gespeichert.", "ok");
      } }, "Speichern"),
      el("button", { class: "btn sm ghost", onclick: async () => { await reloadLibrary(); toast("Bibliothek aktualisiert."); } }, "Bibliothek neu laden"),
      pick,
      el("button", { class: "btn sm ghost", onclick: () => {
        dbg.style.display = dbg.style.display === "none" ? "block" : "none";
        dbg.textContent = libSrc ? (libSrc.files.length + " Dateien gefunden:\n" + libSrc.files.join("\n")) : ("Keine Quelle gefunden:\n" + libLog.join("\n"));
      } }, "Gefundene Dateien anzeigen")),
    dbg,
    el("p", { class: "xsmall muted", style: "margin-top:10px" },
      "Lokal per Doppelklick geöffnet: einmal „Projektordner wählen …“ (Chrome/Edge) — der Ordner wird gemerkt, neue Dateien werden beim " +
      "Neuladen erkannt. Mit „python -m http.server“ im Projektordner geht es ganz ohne Auswahl.")
  );
}

VIEWS.io = () => {
  const wrap = el("div", { class: "page" });
  wrap.append(el("div", { style: "margin-bottom:18px" },
    el("h1", { text: "Import & Export" }),
    el("p", { class: "muted small", style: "max-width:74ch" },
      "Alles liegt als einfaches JSON vor. Sie können einen kompletten Modelltest weitergeben, einzelne Module tauschen oder ein vollständiges Backup anlegen — ohne Konto, ohne Server.")));

  /* export */
  const bp = blueprint();
  const test = currentTest();
  const exp = el("div", { class: "card", style: "margin-bottom:16px" },
    el("h3", { text: "Exportieren" }),
    el("div", { class: "grid g2", style: "margin-top:12px" },
      el("div", { class: "card tight" },
        el("h4", { text: "Aktueller Modelltest" }),
        el("p", { class: "xsmall muted", style: "margin:4px 0 10px", text: test ? test.name : "keiner ausgewählt" }),
        el("button", { class: "btn sm accent", disabled: !test, onclick: () => exportTestDialog(test) }, "Ganz oder modulweise …")),
      el("div", { class: "card tight" },
        el("h4", { text: "Alle Modelltests" }),
        el("p", { class: "xsmall muted", style: "margin:4px 0 10px", text: S.tests.length + " Tests in der Bibliothek" }),
        el("button", { class: "btn sm", onclick: () => download("alle_modelltests.json",
          { kind: "prepstudio.bundle", version: FILE_VERSION, exported: new Date().toISOString(), tests: S.tests }) }, "Als Bündel exportieren")),
      el("div", { class: "card tight" },
        el("h4", { text: "Vollständiges Backup" }),
        el("p", { class: "xsmall muted", style: "margin:4px 0 10px", text: "Tests, Ergebnisse und Aufbau-Anpassungen" }),
        el("button", { class: "btn sm", onclick: () => download("prüfungsstudio_backup.json",
          { kind: "prepstudio.backup", version: FILE_VERSION, exported: new Date().toISOString(),
            tests: S.tests, attempts: S.attempts, pattern: S.pattern }) }, "Backup herunterladen")),
      el("div", { class: "card tight" },
        el("h4", { text: "Einzelnes Modul" }),
        el("p", { class: "xsmall muted", style: "margin:4px 0 10px", text: "aus „" + (test ? test.name : "—") + "“" }),
        el("div", { class: "row" }, test ? moduleKeys(bp).map(mk =>
          el("button", { class: "btn sm ghost", onclick: () => exportModule(test, mk) }, modName(mk))) : null))
    ));
  wrap.append(exp);
  wrap.append(libraryCard());

  /* import */
  const ta = el("textarea", { rows: 8, placeholder: '{ "kind": "prepstudio.test", … }', style: "margin-top:10px;font-family:var(--font-mono);font-size:12px" });
  const modeSeg = el("div", { class: "seg" },
    el("button", { "aria-pressed": "true", "data-mode": "merge" }, "Hinzufügen"),
    el("button", { "aria-pressed": "false", "data-mode": "replace" }, "Gleiche ID ersetzen"));
  let mode = "merge";
  modeSeg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    mode = b.dataset.mode;
    Array.from(modeSeg.children).forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  });

  const drop = el("div", { class: "empty", style: "cursor:pointer",
    onclick: () => $("#fileInput").click(),
    ondragover: e => { e.preventDefault(); drop.style.borderColor = "var(--color-accent)"; },
    ondragleave: () => { drop.style.borderColor = ""; },
    ondrop: e => { e.preventDefault(); drop.style.borderColor = ""; handleFiles(e.dataTransfer.files); } },
    el("div", { style: "font-size:24px" }, "⇩"),
    el("p", { style: "margin-top:8px" }, "JSON-Dateien hierher ziehen oder klicken, um sie auszuwählen"),
    el("p", { class: "xsmall muted" }, "Mehrere Dateien gleichzeitig sind möglich — auch gemischt aus Tests und einzelnen Modulen."));

  wrap.append(el("div", { class: "card" },
    el("div", { class: "row", style: "justify-content:space-between" }, el("h3", { text: "Importieren" }), modeSeg),
    el("div", { style: "margin-top:12px" }, drop),
    el("div", { class: "sep" }),
    el("h4", { text: "Oder JSON einfügen" }),
    ta,
    el("div", { class: "row", style: "margin-top:10px" },
      el("button", { class: "btn accent", onclick: () => {
        try {
          const note = importPayload(JSON.parse(ta.value), mode);
          toast("Importiert — " + note, "ok", 6000); ta.value = ""; refresh();
        } catch (e) { toast(e.message, "err", 9000); }
      } }, "Einfügen und importieren"),
      el("button", { class: "btn ghost", onclick: () => { ta.value = ""; } }, "Leeren"))
  ));
  return wrap;
};

/* =========================================================================

VIEWS.settings = () => {
  const wrap = el("div", { class: "page" });
  const st = S.settings, cfg = st.ai;
  wrap.append(el("h1", { text: "Einstellungen" }),
    el("p", { class: "muted small", style: "margin:6px 0 20px" },
      "Alle Angaben bleiben in diesem Browser. Es gibt kein Konto, keinen Server und keine Zahlung."));

  const card = (title, sub, ...kids) => el("div", { class: "card", style: "margin-bottom:16px" },

  /* --- exam --- */
  const examSel = el("select", { onchange: e => {

  const levelSel = el("select", { onchange: e => { st.level = e.target.value; st.testId = null; saveSettings(); syncTopbar(); refresh(); } },

  wrap.append(card("Prüfung und Niveau",

  };
  wrap.append(card("Prüfungsverhalten", null,
    toggle("Strenger Zeitgeber", "strictTimer", "Bei 00:00 wird das Modul automatisch abgegeben — wie in der echten Prüfung."),
    toggle("Lösungen nach der Abgabe zeigen", "showSolutionsAfter", "Mit Begründung zu jeder Aufgabe."),
    toggle("Nach Antwort automatisch weiter", "autoAdvance", "Springt bei Einzelauswahl zur nächsten Aufgabe."),
    toggle("Sofort-Feedback bei der Auswahl", "instantFeedback", "Ein: Sobald Sie eine Antwort wählen, wird sie sofort grün (richtig) oder rot (falsch). Aus (Standard): normales Prüfungsverhalten, Ergebnis erst nach der Abgabe."),
    toggle("Direkte Lückenauswahl", "directGapFill",
      "Aus (Standard): In Lücken stehen nur Buchstaben (a, b, c …), wie in der echten Prüfung — Sie schlagen das Wort in der Liste daneben nach. An: Das Auswahlmenü in jeder Lücke zeigt das Wort bzw. den Satz direkt mit an, sodass Sie ohne Nachschlagen auswählen können.")
  ));

  /* --- layout --- */

    ["30-70", "Text 30 % · Aufgaben 70 %", "Für kurze Texte und viele Items"],
    ["50-50", "Text 50 % · Aufgaben 50 %", "Der Standard"],
    ["70-30", "Text 70 % · Aufgaben 30 %", "Für lange Lesetexte"],
    ["100",   "Eine Spalte",               "Text oben, Aufgaben darunter"]
  ];
  const ratioRow = el("div", { class: "col", style: "gap:6px" });
  ratios.forEach(([val, label, hint]) => {
    const b = el("button", { class: "btn" + (splitRatio() === val ? " accent" : ""), style: "justify-content:flex-start;width:100%",
      onclick: () => { st.splitRatio = val; saveSettings(); refresh(); } },
      el("span", { style: "font-family:var(--font-mono);min-width:64px", text: val === "100" ? "100" : val }),
      el("span", {}, label));
    ratioRow.append(b, el("div", { class: "xsmall muted", style: "margin:-4px 0 4px 78px", text: hint }));
  });
  wrap.append(card("Ansicht im Prüfungslauf",
    "Links steht das Material (Lesetext, Anzeigen, Hörsteuerung, Aufgabenstellung), rechts stehen die Aufgaben. Auf schmalen Bildschirmen wird immer untereinander gestapelt — dort hat die Auswahl keine Wirkung. Die Aufteilung lässt sich während der Prüfung auch oben in der Leiste umschalten.",
    ratioRow,
    el("div", { class: "sep" }),
    el("label", { class: "row", style: "gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0" },
      el("input", { type: "checkbox", checked: !!st.navHidden,
        onchange: e => { st.navHidden = e.target.checked; saveSettings(); applySidebar(); } }),
      el("div", {}, el("div", { text: "Seitenleiste ausgeblendet" }),
        el("div", { class: "xsmall muted", text: "Mehr Platz für den Prüfungslauf. Mit ☰ oben links jederzeit wieder einblenden." })))
  ));

  /* --- speech --- */
  const voiceSel = el("select", { onchange: e => { st.speechVoice = e.target.value; saveSettings(); } });
  const fillVoices = () => {
    voiceSel.innerHTML = "";
    const vs = Speech.voices();
    voiceSel.append(el("option", { value: "", text: vs.length ? "Automatisch (" + (vs[0] && vs[0].name) + ")" : "Keine deutsche Stimme gefunden" }));
    vs.forEach(v => voiceSel.append(el("option", { value: v.name, selected: v.name === st.speechVoice, text: v.name + " — " + v.lang })));
  };
  fillVoices();
  if (window.speechSynthesis) speechSynthesis.addEventListener("voiceschanged", fillVoices, { once: true });
  const rateLbl = el("span", { class: "mono", text: String(st.speechRate) });

  wrap.append(card("Hörverstehen — Sprachausgabe",
    "Die Hörtexte werden von Ihrem Browser gelesen, damit ein Modelltest ohne Audiodateien auskommt. Unter Windows und macOS sind deutsche Stimmen meist vorinstalliert.",
    el("div", { class: "grid g2" },
      el("label", { class: "field" }, "Stimme", voiceSel),
      el("label", { class: "field" }, el("span", {}, "Tempo ", rateLbl),
        el("input", { type: "range", min: "0.6", max: "1.3", step: "0.05", value: st.speechRate,
          oninput: e => { st.speechRate = Number(e.target.value); rateLbl.textContent = e.target.value; saveSettings(); } }))),
    el("div", { class: "row", style: "margin-top:12px" },
      el("button", { class: "btn sm", onclick: () => Speech.speak([{ speaker: "", text: "Guten Tag. Sie hören nun einen kurzen Beispieltext. Die Prüfung beginnt in wenigen Augenblicken." }]) }, "▶ Probe hören"),
      el("button", { class: "btn sm ghost", onclick: () => Speech.stop() }, "■ Stopp"))
  ));

  /* --- AI --- */
  wrap.append(card("KI-Zugang",
    "Es wird ein OpenAI-kompatibler Endpunkt angesprochen. Voreingestellt ist die Kompatibilitätsschicht von Google Gemini. Der Schlüssel wird nur an diese Adresse gesendet.",
    el("div", { class: "grid g2" },
      el("label", { class: "field" }, "Basis-URL",
        el("input", { type: "text", value: cfg.baseUrl, oninput: e => { cfg.baseUrl = e.target.value.trim(); cfg.connected = false; saveSettings(); } })),
      el("label", { class: "field" }, "Modell",
        el("input", { type: "text", value: cfg.model, oninput: e => { cfg.model = e.target.value.trim(); saveSettings(); } })),
      el("label", { class: "field", style: "grid-column:1/-1" }, "API-Schlüssel",
        el("input", { type: "password", value: cfg.apiKey, placeholder: "Ihren eigenen Schlüssel einfügen",
          oninput: e => { cfg.apiKey = e.target.value; cfg.connected = false; saveSettings(); } }))),
    el("div", { class: "row", style: "margin-top:14px" },
      el("button", { class: "btn accent", onclick: () => AI.testConnection() }, "Verbindung testen"),
      el("button", { class: "btn ghost sm", onclick: () => { cfg.apiKey = ""; cfg.connected = false; saveSettings(); refresh(); toast("Schlüssel gelöscht."); } }, "Schlüssel löschen"),
      el("span", { class: "xsmall muted", text: cfg.connected ? "zuletzt erfolgreich geprüft" : "noch nicht geprüft" })),
    el("p", { class: "xsmall muted", style: "margin-top:10px" },
      "Hinweis: Browser blockieren solche Aufrufe in eingebetteten Vorschauen. Öffnen Sie die heruntergeladene Datei direkt, dann funktioniert die Generierung.")
  ));

  /* --- mistake analysis --- */
  const mCfg = st.mistakeAnalysis;
  const mToggle = el("input", { type: "checkbox", checked: !!mCfg.enabled,
    onchange: e => { mCfg.enabled = e.target.checked; saveSettings(); } });
  const langInput = el("input", { type: "text", value: mCfg.explainLang, placeholder: "leer = Deutsch, z. B. Bengali oder English",
    oninput: e => { mCfg.explainLang = e.target.value; saveSettings(); } });
  wrap.append(card("KI-Fehleranalyse",
    "Markiert Fehler in Schreiben und Sprechen farbig direkt im Text (falsches Wort, fehlendes Wort, überflüssiges Wort, Zeichensetzung, Ton, Stil) und bietet bei Lesen und Hören eine ausführliche Erklärung an, warum eine Lösung richtig oder falsch ist. Die Gewichtung passt sich automatisch an das gewählte Niveau an — bei A1/A2 zählen Grundfehler am meisten, bei C1/C2 vor allem Präzision, Register und Nuancen.",
    el("label", { class: "row", style: "gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0" }, mToggle,
      el("div", {}, el("div", { text: "KI-Fehleranalyse aktivieren" }),
        el("div", { class: "xsmall muted", text: "Aus: nur die bisherige Punktzahl und kurze Rückmeldung. An: zusätzlich farbige Markierungen und eine Erklär-Option bei jeder Lösung." }))),
    el("div", { class: "sep" }),
    el("label", { class: "field" }, "Erklärungssprache",
      langInput),
    el("p", { class: "xsmall muted", style: "margin-top:6px" },
      "Legt fest, in welcher Sprache die KI ihre Erklärungen, Kommentare und Verbesserungsvorschläge schreibt — der deutsche Prüfungstext, die Musterlösungen und die korrigierte Fassung bleiben immer auf Deutsch. Feld leer lassen für deutsche Erklärungen, oder z. B. „Bengali“, „English“, „Türkçe“ eintragen.")
  ));

  /* --- appearance --- */
  wrap.append(card("Darstellung", null,
    el("div", { class: "grid g2" },
      el("label", { class: "field" }, "Sprache der Oberfläche",
        el("select", { onchange: e => { st.lang = e.target.value; saveSettings(); applyI18n(); refresh(); } },
          el("option", { value: "de", selected: st.lang === "de", text: "Deutsch" }),
          el("option", { value: "en", selected: st.lang === "en", text: "English" }))),
      el("label", { class: "field" }, "Farbschema",
        el("select", { onchange: e => { st.theme = e.target.value; saveSettings(); applyTheme(); } },
          el("option", { value: "light", selected: st.theme === "light", text: "Hell" }),
          el("option", { value: "dark", selected: st.theme === "dark", text: "Dunkel" }))))
  ));

  /* --- data --- */
  wrap.append(card("Daten",
    "Alles liegt in der lokalen Speicherung dieses Browsers. Leeren Sie die Browserdaten, sind auch diese Inhalte weg — exportieren Sie regelmäßig.",
    el("div", { class: "row" },
      el("button", { class: "btn sm", onclick: () => go("io") }, "Zum Export"),
      el("button", { class: "btn sm", onclick: () => { installSeeds(); toast("Standard-Modelltests ergänzt.", "ok"); refresh(); } }, "Standard-Modelltests wiederherstellen"),
      el("button", { class: "btn sm danger", onclick: () => confirmBox("Wirklich alles löschen?",
        "Modelltests, Antworten, Ergebnisse und Einstellungen werden entfernt. Danach startet das Programm neu.", () => {
          [LS.settings, LS.tests, LS.attempts, LS.answers, LS.pattern].forEach(k => store.remove(k));
          location.reload();
        }) }, "Alles zurücksetzen")),
    el("div", { class: "xsmall muted", style: "margin-top:12px" },

  ));
  return wrap;
};

<script>
"use strict";
/* =========================================================================
   BOOT
   ======================================================================= */
/* ---- sidebar: a rail you can hide on desktop, a drawer on narrow screens ---- */
const isNarrow = () => window.matchMedia("(max-width: 900px)").matches;

function applySidebar() {
  const shell = $(".shell"), bar = $("#sidebar"), scrim = $("#navScrim"), btn = $("#navToggle");
  if (isNarrow()) {
    shell.classList.remove("nav-hidden");
    const open = bar.classList.contains("open");
    scrim.hidden = !open;
    if (btn) btn.setAttribute("aria-expanded", String(open));
  } else {
    bar.classList.remove("open");
    scrim.hidden = true;
    shell.classList.toggle("nav-hidden", !!S.settings.navHidden);
    if (btn) btn.setAttribute("aria-expanded", String(!S.settings.navHidden));
  }
}
function toggleSidebar() {
  if (isNarrow()) $("#sidebar").classList.toggle("open");
  else { S.settings.navHidden = !S.settings.navHidden; saveSettings(); }
  applySidebar();
}
function closeDrawer() { $("#sidebar").classList.remove("open"); applySidebar(); }

function applyTheme() {
  document.documentElement.setAttribute("data-theme", S.settings.theme === "light" ? "light" : "dark");
  const lbl = $("#themeLabel");
  if (lbl) lbl.textContent = S.settings.theme === "light" ? "Dunkel" : "Hell";
}

function applyI18n() {
  $$("[data-i18n]").forEach(n => { n.textContent = t(n.dataset.i18n); });
  $$("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.settings.lang)));
  document.documentElement.lang = S.settings.lang;
}

function buildModuleNav() {
  const host = $("#moduleNav");
  host.innerHTML = "";
  const bp = blueprint();
  const test = currentTest();
  for (const mk of moduleKeys(bp)) {
    const cov = test ? moduleCoverage(test, mk) : { filled: 0, total: 0 };
    host.append(el("button", { class: "navitem " + MODULE_META[mk].cls,
      onclick: () => { if (test && cov.filled) startRun(test.id, mk); else go("structure", { focus: mk }); } },
      el("span", { class: "ic" }, el("span", { class: "mod-dot" })),
      el("span", { text: modName(mk) }),
      el("span", { class: "tag", text: moduleMinutes(bp.modules[mk]) + "′" })));
  }
}

function syncTopbar() {
  const st = S.settings;

  const exSel = $("#examSelect");
  exSel.innerHTML = "";
  Object.values(BLUEPRINTS).forEach(x =>
    exSel.append(el("option", { value: x.id, selected: x.id === st.exam, text: x.name })));

  const lvSel = $("#levelSelect");
  lvSel.innerHTML = "";
  const lvList = levelsFor(st.exam);
  lvSel.style.display = lvList.length > 1 ? "" : "none";   // one level only (e.g. TestDaF): nothing to pick, so hide it
  lvList.forEach(l => lvSel.append(el("option", { value: l, selected: l === st.level, text: l })));
  if (!lvList.includes(st.level)) { st.level = lvList[0]; saveSettings(); lvSel.value = st.level; }

  const tSel = $("#testSelect");
  tSel.innerHTML = "";
  const list = currentTests();
  if (!list.length) tSel.append(el("option", { value: "", text: "— kein Modelltest —" }));
  list.forEach(x => tSel.append(el("option", { value: x.id, selected: x.id === st.testId, text: x.name })));
  if (list.length && !list.some(x => x.id === st.testId)) { st.testId = list[0].id; saveSettings(); tSel.value = st.testId; }

  const bp = blueprint();
  $("#passPill").textContent = "Bestehen: " + passLabel(bp);
  $("#navTestCount").textContent = S.tests.length;
  $("#aiStatus").textContent = S.settings.ai.apiKey
    ? (S.settings.ai.connected ? "KI: verbunden" : "KI: Schlüssel hinterlegt")
    : "KI: nicht verbunden";
  buildModuleNav();
  renderLibRow();
}

/* =========================================================================
   PWA — installierbar machen und offline zum Laufen bringen.
   Läuft nur über http(s) (Vercel, GitHub Pages, PHP-Webspace, lokaler
   Server); beim Doppelklick auf die Datei (file://) wird nichts registriert,
   die App funktioniert dort aber wie gewohnt online weiter.
   ======================================================================= */
function registerPWA() {
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
      .then(reg => { try { reg.update(); } catch (e) {} })
      .catch(() => {});
  }
  let deferredPrompt = null;
  const btn = $("#installBtn");
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    if (btn) btn.hidden = false;
  });
  if (btn) btn.addEventListener("click", async () => {
    if (!deferredPrompt) { toast("Installation ist in diesem Browser bereits verfügbar über das Menü (⋮ oder Teilen → Zum Startbildschirm).", "", 6000); return; }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    btn.hidden = true;
  });
  window.addEventListener("appinstalled", () => { if (btn) btn.hidden = true; toast("App installiert.", "ok"); });
}

function boot() {
  ensureTestsArray();
  applyTheme();
  applyI18n();
  registerPWA();

  /* nav */
  $$(".navitem[data-view]").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));
  applySidebar();
  $("#navToggle").addEventListener("click", toggleSidebar);
  $("#navScrim").addEventListener("click", () => { if (isNarrow()) closeDrawer(); });
  $("#themeBtn").addEventListener("click", () => {
    S.settings.theme = S.settings.theme === "light" ? "dark" : "light";
    saveSettings(); applyTheme();
  });
  $("#langSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    S.settings.lang = b.dataset.lang; saveSettings(); applyI18n(); syncTopbar(); refresh();
  });

  /* topbar */
  $("#examSelect").addEventListener("change", e => {
    S.settings.exam = e.target.value;
    const lv = levelsFor(S.settings.exam);
    if (!lv.includes(S.settings.level)) S.settings.level = lv.includes("B2") ? "B2" : lv[0];
    S.settings.testId = null; S.run = null;
    resetLibPath();
    saveSettings(); syncTopbar(); refresh();
  });
  $("#levelSelect").addEventListener("change", e => {
    S.settings.level = e.target.value; S.settings.testId = null; S.run = null;
    resetLibPath();
    saveSettings(); syncTopbar(); refresh();
  });
  $("#testSelect").addEventListener("change", e => {
    S.settings.testId = e.target.value || null; S.run = null;
    saveSettings(); syncTopbar(); refresh();
  });
  $("#quickGenBtn").addEventListener("click", () => {
    const tst = currentTest();
    if (!tst) return toast("Legen Sie zuerst einen Modelltest an.", "err");
    aiGenerateAll(tst.id);
  });
  $("#fileInput").addEventListener("change", e => { handleFiles(e.target.files); e.target.value = ""; });

  window.addEventListener("resize", applySidebar);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && isNarrow() && $("#sidebar").classList.contains("open")) closeDrawer();
    if (e.key === "Escape") hideSelPop();
  });
  document.addEventListener("mouseup", handleSelectionMouseUp);
  document.addEventListener("touchend", handleSelectionMouseUp);
  document.addEventListener("click", handleMarkClick);

  /* warn before leaving a running module */
  window.addEventListener("beforeunload", e => {
    if (S.run && !S.run.finished) { e.preventDefault(); e.returnValue = ""; }
  });

  libInit();
  syncTopbar();
  go("dashboard");
}

/* keep the topbar in step with whatever a view changed */
const _go = go;
go = function (view, params) { _go(view, params); try { syncTopbar(); } catch (e) {} };

document.addEventListener("DOMContentLoaded", boot);
if (document.readyState !== "loading") boot();
</script>
</body>
</html>
